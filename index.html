<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Трекер</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <div class="header-title">
        Трекер
      </div>

      <button class="header-button" id="menuButton">
        ⋮
      </button>

    </header>


    <!-- MAIN -->
    <main class="main">

      <!-- DATE -->
      <section class="date-section">

        <button class="round-button" id="prevDay">
          ‹
        </button>

        <div class="date-center">

          <div class="date-title" id="dateTitle">
            Сегодня
          </div>

          <div class="date-subtitle" id="dateSubtitle">
            Вс, 16 авг.
          </div>

        </div>

        <button class="round-button" id="nextDay">
          ›
        </button>

        <button class="calendar-button" id="calendarButton">
          ▣
        </button>

      </section>


      <!-- PROGRESS -->
      <section class="progress-card">

        <div class="progress-number">
          <span id="completedCount">0</span>
          <span class="progress-divider">/</span>
          <span id="totalCount">0</span>
        </div>

      </section>


      <!-- EMPTY -->
      <section class="empty-card" id="emptyState">

        <div class="empty-icon">
          🐥
        </div>

        <div class="empty-title">
          На сегодня задач нет
        </div>

      </section>


      <!-- TASKS -->
      <section class="tasks" id="tasksList">
      </section>


      <!-- ADD -->
      <button class="add-task-button" id="addTaskButton">

        <span class="plus">
          +
        </span>

        <span>
          Добавить задачу
        </span>

      </button>


      <!-- MORE -->
      <button class="more-button" id="moreButton">

        <span>
          ˅
        </span>

        <span>
          Ещё
        </span>

      </button>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation">

      <button class="nav-item active">

        <div class="nav-icon">
          ✓
        </div>

        <div class="nav-label">
          Задачи
        </div>

      </button>


      <button class="nav-item">

        <div class="nav-icon">
          ◉
        </div>

        <div class="nav-label">
          Привычки
        </div>

      </button>


      <button class="nav-item">

        <div class="nav-icon">
          ◎
        </div>

        <div class="nav-label">
          Цели на год
        </div>

      </button>


      <button class="nav-item">

        <div class="nav-icon">
          ▥
        </div>

        <div class="nav-label">
          Аналитика
        </div>

      </button>

    </nav>


    <!-- ADD TASK MODAL -->
    <div class="modal hidden" id="taskModal">

      <div class="modal-overlay" id="modalOverlay"></div>

      <div class="modal-window">

        <div class="modal-header">

          <div class="modal-title">
            Новая задача
          </div>

          <button
            class="modal-close"
            id="closeModal"
          >
            ×
          </button>

        </div>


        <input
          class="task-input"
          id="taskInput"
          type="text"
          placeholder="Название задачи"
          autocomplete="off"
        />


        <button
          class="save-task-button"
          id="saveTaskButton"
        >
          Добавить
        </button>

      </div>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
