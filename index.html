<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f5f5f3"
  >

  <meta
    name="description"
    content="Минималистичный трекер задач"
  >

  <title>Трекер</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="app">


    <!-- HEADER -->

    <header class="header">

      <div class="greeting">

        <span
          class="greeting-small"
          id="currentDate"
        >
          Загрузка...
        </span>

        <h1>
          Сегодня
        </h1>

      </div>


      <button
        class="profile-button"
        type="button"
        aria-label="Профиль"
      >
        •••
      </button>

    </header>


    <!-- PROGRESS -->

    <section
      class="progress-card"
      aria-label="Прогресс дня"
    >

      <div class="progress-top">

        <span class="progress-title">
          Прогресс дня
        </span>

        <span
          class="progress-percent"
          id="progressPercent"
        >
          0%
        </span>

      </div>


      <div
        class="progress-bar"
        aria-hidden="true"
      >

        <div
          class="progress-fill"
          id="progressFill"
        ></div>

      </div>


      <div class="progress-bottom">

        <span id="progressTasks">
          0 из 0 задач
        </span>

        <span id="progressMessage">
          Начнём?
        </span>

      </div>

    </section>


    <!-- TASKS -->

    <section>

      <div class="section-header">

        <h2>
          Задачи
        </h2>


        <button
          class="section-link"
          id="clearCompleted"
          type="button"
        >
          Очистить
        </button>

      </div>


      <div
        class="tasks"
        id="tasksContainer"
      >

        <!-- Tasks are rendered by app.js -->

      </div>

    </section>


  </main>


  <!-- ADD TASK -->

  <button
    class="add-button"
    id="addButton"
    type="button"
    aria-label="Добавить задачу"
  >
    +
  </button>


  <!-- BOTTOM NAVIGATION -->

  <nav
    class="bottom-nav"
    aria-label="Основная навигация"
  >

    <button
      class="nav-item active"
      type="button"
      data-page="home"
    >

      <span
        class="nav-icon"
        aria-hidden="true"
      >
        ⌂
      </span>

      <span>
        Главная
      </span>

    </button>


    <button
      class="nav-item"
      type="button"
      data-page="calendar"
    >

      <span
        class="nav-icon"
        aria-hidden="true"
      >
        □
      </span>

      <span>
        Календарь
      </span>

    </button>


    <button
      class="nav-item"
      type="button"
      data-page="analytics"
    >

      <span
        class="nav-icon"
        aria-hidden="true"
      >
        ◔
      </span>

      <span>
        Аналитика
      </span>

    </button>


    <button
      class="nav-item"
      type="button"
      data-page="settings"
    >

      <span
        class="nav-icon"
        aria-hidden="true"
      >
        ⚙
      </span>

      <span>
        Настройки
      </span>

    </button>

  </nav>


  <!-- CREATE TASK MODAL -->

  <div
    class="modal-overlay"
    id="modalOverlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >

    <div class="modal">


      <!-- MODAL HANDLE -->

      <div
        class="modal-handle"
        aria-hidden="true"
      ></div>


      <!-- MODAL HEADER -->

      <div class="modal-header">

        <h2 id="modalTitle">
          Новая задача
        </h2>


        <button
          class="modal-close"
          id="closeModal"
          type="button"
          aria-label="Закрыть"
        >
          ×
        </button>

      </div>


      <!-- FORM -->

      <form id="taskForm">


        <!-- TITLE -->

        <div class="form-group">

          <label
            class="form-label"
            for="taskTitle"
          >
            Название
          </label>


          <input
            class="form-input"
            id="taskTitle"
            type="text"
            placeholder="Например: Прочитать книгу"
            autocomplete="off"
            required
          >

        </div>


        <!-- DATE + TIME -->

        <div class="form-row">


          <div class="form-group">

            <label
              class="form-label"
              for="taskDate"
            >
              Дата
            </label>


            <input
              class="form-input"
              id="taskDate"
              type="date"
              required
            >

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="taskTime"
            >
              Время
            </label>


            <input
              class="form-input"
              id="taskTime"
              type="time"
            >

          </div>


        </div>


        <!-- REPEAT -->

        <div class="form-group">

          <label
            class="form-label"
            for="taskRepeat"
          >
            Периодичность
          </label>


          <select
            class="form-select"
            id="taskRepeat"
          >

            <option value="none">
              Один раз
            </option>

            <option value="daily">
              Каждый день
            </option>

            <option value="weekdays">
              По будням
            </option>

            <option value="weekends">
              По выходным
            </option>

            <option value="weekly">
              Каждую неделю
            </option>

            <option value="biweekly">
              Каждые 2 недели
            </option>

            <option value="monthly">
              Каждый месяц
            </option>

          </select>

        </div>


        <!-- SAVE -->

        <button
          class="save-button"
          type="submit"
        >
          Создать задачу
        </button>


      </form>

    </div>

  </div>


  <!-- JAVASCRIPT -->

  <script src="app.js"></script>

</body>

</html>
