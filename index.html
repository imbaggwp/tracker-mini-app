<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#222f3f" />

  <title>Трекер</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="app">

  <!-- ================= HEADER ================= -->

  <header class="header">

    <div class="header-title">
      Трекер
    </div>

    <button
      class="header-button"
      id="menuButton"
      aria-label="Меню"
    >
      ⋮
    </button>

  </header>


  <!-- ================= MAIN ================= -->

  <main class="main">

    <!-- DATE -->

    <section class="date-section">

      <button
        class="round-button"
        id="prevDay"
        aria-label="Предыдущий день"
      >
        ‹
      </button>

      <div class="date-center">

        <div
          class="date-title"
          id="dateTitle"
        >
          Сегодня
        </div>

        <div
          class="date-subtitle"
          id="dateSubtitle"
        >
          Вс, 16 авг.
        </div>

      </div>

      <button
        class="round-button"
        id="nextDay"
        aria-label="Следующий день"
      >
        ›
      </button>

      <button
        class="calendar-button"
        id="calendarButton"
        aria-label="Календарь"
      >
        ▣
      </button>

    </section>


    <!-- PROGRESS -->

    <section class="progress-card">

      <div class="progress-number">

        <span id="completedCount">
          0
        </span>

        <span class="progress-divider">
          /
        </span>

        <span id="totalCount">
          0
        </span>

      </div>

    </section>


    <!-- EMPTY -->

    <section
      class="empty-card"
      id="emptyState"
    >

      <div class="empty-icon">
        🐥
      </div>

      <div class="empty-title">
        На сегодня задач нет
      </div>

    </section>


    <!-- TASKS -->

    <section
      class="tasks"
      id="tasksList"
    ></section>


    <!-- ADD TASK -->

    <button
      class="add-task-button"
      id="addTaskButton"
    >

      <span class="plus">
        +
      </span>

      <span>
        Добавить задачу
      </span>

    </button>


    <!-- MORE -->

    <button
      class="more-button"
      id="moreButton"
    >

      <span>
        ˅
      </span>

      <span>
        Ещё
      </span>

    </button>

  </main>


  <!-- ================= BOTTOM NAV ================= -->

  <nav class="bottom-navigation">

    <button
      class="nav-item active"
      data-page="tasks"
    >

      <div class="nav-icon">
        ✓
      </div>

      <div class="nav-label">
        Задачи
      </div>

    </button>


    <button
      class="nav-item"
      data-page="habits"
    >

      <div class="nav-icon">
        ◉
      </div>

      <div class="nav-label">
        Привычки
      </div>

    </button>


    <button
      class="nav-item"
      data-page="goals"
    >

      <div class="nav-icon">
        ◎
      </div>

      <div class="nav-label">
        Цели на год
      </div>

    </button>


    <button
      class="nav-item"
      data-page="analytics"
    >

      <div class="nav-icon">
        ▥
      </div>

      <div class="nav-label">
        Аналитика
      </div>

    </button>

  </nav>


  <!-- ================= TASK MODAL ================= -->

  <div
    class="modal hidden"
    id="taskModal"
  >

    <div
      class="modal-overlay"
      id="modalOverlay"
    ></div>


    <div class="modal-window">

      <div class="modal-header">

        <div
          class="modal-title"
          id="modalTitle"
        >
          Новая задача
        </div>

        <button
          class="modal-close"
          id="closeModal"
          aria-label="Закрыть"
        >
          ×
        </button>

      </div>


      <!-- TITLE -->

      <input
        class="task-input"
        id="taskInput"
        type="text"
        placeholder="Название задачи"
        autocomplete="off"
      />


      <!-- DESCRIPTION -->

      <textarea
        class="task-description"
        id="taskDescription"
        placeholder="Описание"
      ></textarea>


      <!-- OPTIONS -->

      <div class="task-options">


        <!-- DATE -->

        <button
          class="task-option"
          id="dateOption"
        >

          <span class="option-icon">
            📅
          </span>

          <span class="option-content">

            <span class="option-title">
              Дата
            </span>

            <span
              class="option-value"
              id="dateValue"
            >
              Сегодня
            </span>

          </span>

          <span class="option-arrow">
            ›
          </span>

        </button>


        <!-- TIME -->

        <button
          class="task-option"
          id="timeOption"
        >

          <span class="option-icon">
            🕐
          </span>

          <span class="option-content">

            <span class="option-title">
              Время
            </span>

            <span
              class="option-value"
              id="timeValue"
            >
              Без времени
            </span>

          </span>

          <span class="option-arrow">
            ›
          </span>

        </button>


        <!-- REPEAT -->

        <button
          class="task-option"
          id="repeatOption"
        >

          <span class="option-icon">
            🔁
          </span>

          <span class="option-content">

            <span class="option-title">
              Повторение
            </span>

            <span
              class="option-value"
              id="repeatValue"
            >
              Не повторять
            </span>

          </span>

          <span class="option-arrow">
            ›
          </span>

        </button>


        <!-- IMPORTANT -->

        <button
          class="task-option"
          id="importantOption"
        >

          <span class="option-icon">
            ⭐
          </span>

          <span class="option-content">

            <span class="option-title">
              Важная задача
            </span>

            <span
              class="option-value"
              id="importantValue"
            >
              Выключено
            </span>

          </span>

          <span class="option-toggle">

            <span class="toggle-circle"></span>

          </span>

        </button>

      </div>


      <!-- SUBTASK -->

      <button
        class="add-subtask"
        id="addSubtaskButton"
      >

        <span>
          +
        </span>

        <span>
          Добавить подзадачу
        </span>

      </button>


      <div
        class="subtasks"
        id="subtasks"
      ></div>


      <!-- SAVE -->

      <button
        class="save-task-button"
        id="saveTaskButton"
      >
        Сохранить
      </button>


      <!-- DELETE -->

      <button
        class="delete-task-button hidden"
        id="deleteTaskButton"
      >
        Удалить задачу
      </button>

    </div>

  </div>


  <!-- ================= DATE PICKER ================= -->

  <div
    class="picker hidden"
    id="datePicker"
  >

    <div
      class="picker-overlay"
      id="datePickerOverlay"
    ></div>

    <div class="picker-window">

      <div class="picker-header">

        <button
          class="picker-close"
          id="closeDatePicker"
        >
          ×
        </button>

        <div class="picker-title">
          Выберите дату
        </div>

      </div>

      <input
        class="date-input"
        id="dateInput"
        type="date"
      />

      <button
        class="picker-confirm"
        id="confirmDate"
      >
        Готово
      </button>

    </div>

  </div>


  <!-- ================= TIME PICKER ================= -->

  <div
    class="picker hidden"
    id="timePicker"
  >

    <div
      class="picker-overlay"
      id="timePickerOverlay"
    ></div>

    <div class="picker-window">

      <div class="picker-header">

        <button
          class="picker-close"
          id="closeTimePicker"
        >
          ×
        </button>

        <div class="picker-title">
          Выберите время
        </div>

      </div>

      <input
        class="time-input"
        id="timeInput"
        type="time"
      />

      <button
        class="picker-secondary"
        id="removeTime"
      >
        Убрать время
      </button>

      <button
        class="picker-confirm"
        id="confirmTime"
      >
        Готово
      </button>

    </div>

  </div>


  <!-- ================= REPEAT PICKER ================= -->

  <div
    class="picker hidden"
    id="repeatPicker"
  >

    <div
      class="picker-overlay"
      id="repeatPickerOverlay"
    ></div>

    <div class="picker-window">

      <div class="picker-header">

        <button
          class="picker-close"
          id="closeRepeatPicker"
        >
          ×
        </button>

        <div class="picker-title">
          Повторение
        </div>

      </div>


      <button
        class="repeat-choice"
        data-repeat="none"
      >
        Не повторять
      </button>

      <button
        class="repeat-choice"
        data-repeat="daily"
      >
        Каждый день
      </button>

      <button
        class="repeat-choice"
        data-repeat="weekdays"
      >
        По будням
      </button>

      <button
        class="repeat-choice"
        data-repeat="weekly"
      >
        Каждую неделю
      </button>

      <button
        class="repeat-choice"
        data-repeat="monthly"
      >
        Каждый месяц
      </button>


    </div>

  </div>


  <script src="app.js"></script>

</div>

</body>
</html>
