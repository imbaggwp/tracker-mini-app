<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Просто Трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#17212b; --card:#1e2a36; --card2:#24313f; --line:#2c3a49;
    --text:#eef4fa; --muted:#7f8e9c; --accent:#64a9dd;
    --ok:#6fce8a; --warn:#f2c94c; --danger:#e06c6c;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font:inherit}
  .hidden{display:none!important}

  /* ===== Иконки ===== */
  .icn{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
  .round .icn{width:16px;height:16px;stroke-width:2.4}
  .nav-btn .icn{width:17px;height:17px;stroke-width:2}
  .segment .icn{width:15px;height:15px;stroke-width:2}
  .li .icn{width:16px;height:16px;stroke-width:2}
  .arr .icn{width:16px;height:16px;stroke-width:2.2}
  .wide-btn .icn{width:17px;height:17px;stroke-width:2.2}
  .more-btn .icn{width:16px;height:16px;stroke-width:2.2;transition:transform .2s}
  .more-btn.open .icn{transform:rotate(180deg)}
  .empty .icn{width:76px;height:76px;stroke-width:1.2;display:block;margin:0 auto 12px}
  .chk .icn{width:13px;height:13px;stroke-width:3.2}
  .sub .chk .icn{width:10px;height:10px}
  .mini-del .icn{width:16px;height:16px;stroke-width:1.7}
  .t-ic{display:inline-flex;margin-right:4px;vertical-align:-2px}
  .t-ic .icn{width:13px;height:13px;stroke-width:2.2}
  .t-ic.imp{color:var(--warn)}
  .t-ic.ntf{color:var(--accent)}
  .t-ic.rpt{color:var(--muted)}
  .star .icn{width:18px;height:18px;color:var(--warn);stroke-width:1.6}
  .li{color:#fff}

  .app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
  .h-title{font-size:20px;font-weight:700}
  .h-actions{display:flex;gap:6px}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}
  .icon-btn:active{background:var(--card2)}

  .topbar{display:flex;align-items:center;gap:8px;padding:4px 14px 12px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;overflow:hidden}
  .round{background:var(--card2);width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
  .pill{flex:1;max-width:190px;margin:0 auto;background:var(--card2);border-radius:14px;padding:7px 10px;text-align:center;line-height:1.25}
  .pill .t{display:block;color:var(--accent);font-size:13px;font-weight:600}
  .pill .b{display:block;color:var(--muted);font-size:11px}

  main{padding:0 14px 96px}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-head .m{font-size:17px;font-weight:700}
  .cal-nav{display:flex;gap:4px}
  .cal-nav button{color:var(--accent);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .cal-nav .icn{width:16px;height:16px;stroke-width:2.4}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-wd{color:var(--muted);font-size:11px;text-align:center;padding:6px 0}
  .cal-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px}
  .cal-day .n{font-size:15px;font-weight:600;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .cal-day .c{font-size:10px;color:var(--muted)}
  .cal-day.past{opacity:.45}
  .cal-day.today .n{background:var(--card2);color:var(--accent)}
  .cal-day.sel .n{background:var(--accent);color:#0d1720}
  .cal-day:active{background:var(--card2)}

  .summary{display:flex;justify-content:flex-end;align-items:center;padding:14px 18px}
  .summary .v{font-size:22px;font-weight:800}

  .task-row{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:12px;margin-bottom:8px}
  .chk{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:transparent}
  .task-row.done .chk{background:var(--accent);border-color:var(--accent);color:#0d1720}
  .task-row.done .t{opacity:.55;text-decoration:line-through}
  .task-row .t{flex:1;word-break:break-word;font-size:15px}
  .mini-del{color:var(--muted);padding:4px;display:flex}
  .empty{text-align:center;color:var(--muted);padding:22px 0;font-size:14px}

  .wide-btn{width:100%;background:var(--card);border-radius:16px;padding:15px;font-weight:600;font-size:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:9px}
  .wide-btn:active{background:var(--card2)}
  .more-btn{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;font-size:15px}

  .segment{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
  .segment button{flex:1;padding:10px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
  .segment button.active{background:var(--card2);color:var(--accent)}

  .year-head{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
  .year-head .y{font-size:17px;font-weight:700}
  .year-head button{color:var(--accent);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .year-head .icn{width:16px;height:16px;stroke-width:2.4}
  .months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .months-grid button{background:var(--card2);border-radius:12px;padding:12px 0;color:var(--muted);font-weight:600;font-size:14px}
  .months-grid button.cur{background:#2b4a66;color:var(--accent)}
  .wd-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
  .wd-head span{color:var(--muted);font-size:10px;text-align:center}
  .h-row{background:var(--card2);border-radius:14px;padding:12px;margin-bottom:8px}
  .h-name{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
  .h-name .cnt{color:var(--muted);font-weight:500;font-size:12px;flex:none}
  .h-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dot{height:34px;border-radius:10px;background:var(--card);color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .dot.on{background:var(--accent);color:#0d1720}
  .dot.future{opacity:.35}
  .h-month{display:flex;align-items:center;gap:10px}
  .h-month .bar{flex:1;height:8px;border-radius:4px;background:var(--card);overflow:hidden}
  .h-month .bar i{display:block;height:100%;background:var(--accent)}
  .mark-btn{background:var(--accent);color:#0d1720;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;flex:none}
  .mark-btn.off{background:var(--card);color:var(--muted)}

  .goal{background:var(--card2);border-radius:14px;padding:14px;margin-bottom:10px}
  .g-head{display:flex;align-items:flex-start;gap:10px}
  .g-head .tt{flex:1;font-weight:700;font-size:15px}
  .g-desc{color:var(--muted);font-size:13px;margin:6px 0 0 28px}
  .g-prog{display:flex;align-items:center;gap:10px;margin:12px 0 8px}
  .g-prog .bar{flex:1;height:8px;border-radius:4px;background:var(--card);overflow:hidden}
  .g-prog .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .g-prog .num{font-weight:700;font-size:13px;color:var(--accent);flex:none}
  .g-ctrl{display:flex;gap:8px}
  .g-ctrl button{background:var(--card);border-radius:10px;width:40px;height:34px;font-size:17px;font-weight:700}
  .g-ctrl .done-tag{flex:1;text-align:center;color:var(--ok);font-weight:700;align-self:center}
  .subs{margin-top:10px}
  .sub{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
  .sub .chk{width:20px;height:20px;border-width:2px}
  .sub.done .chk{background:var(--accent);border-color:var(--accent);color:#0d1720}
  .sub.done .t{opacity:.55;text-decoration:line-through}

  .a-title{font-size:14px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .a-title .icn{width:15px;height:15px;stroke-width:2}
  .a-big{font-size:24px;font-weight:800;margin-bottom:10px}
  .a-bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
  .a-bar i{display:block;height:100%;background:var(--accent)}
  .bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bars .b{width:100%;border-radius:6px;background:var(--accent);min-height:4px}
  .bars .l{font-size:10px;color:var(--muted)}

  .bottom-nav{position:fixed;left:0;right:0;bottom:0;background:#101820;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px}
  .nav-btn .nb-ic{width:34px;height:30px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:#cfd9e2}
  .nav-btn.active{color:var(--accent)}
  .nav-btn.active .nb-ic{background:var(--accent);color:#0d1720}

  .foot{text-align:center;color:var(--muted);font-size:13px;padding:6px 0 2px}

  .overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
  .ov-header{display:flex;align-items:center;gap:8px;padding:14px 12px 10px}
  .ov-header .t{flex:1;font-size:18px;font-weight:700;text-align:center;margin-right:76px}
  .ov-body{flex:1;overflow-y:auto;padding:4px 14px 30px}
  .ov-title-big{text-align:center;font-size:18px;font-weight:700;margin:14px 0 18px}
  .sec-title{color:var(--accent);font-size:14px;font-weight:600;margin:16px 2px 8px}
  .list-card{background:var(--card);border-radius:16px;overflow:hidden}
  .list-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;font-size:15px}
  .list-row + .list-row{border-top:1px solid var(--line)}
  .list-row .li{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
  .list-row .lt{flex:1}
  .list-row .val{color:var(--muted);font-size:13px}
  .list-row .arr{color:var(--muted);display:flex}
  .val-pill{background:var(--card2);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;flex:none}
  .switch{position:relative;width:46px;height:27px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
  .switch .sl{position:absolute;inset:0;border-radius:14px;background:#3a4753;transition:.2s}
  .switch .sl::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked + .sl{background:var(--accent)}
  .switch input:checked + .sl::after{transform:translateX(19px)}

  .form-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
  .form-card textarea,.form-card input[type=text],.form-card input[type=number]{width:100%;background:var(--card2);border:none;outline:none;border-radius:12px;padding:12px;color:var(--text);font-size:15px;resize:vertical}
  .form-card label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  .save-btn{width:100%;margin-top:6px;background:var(--accent);color:#0d1720;border-radius:14px;padding:14px;font-weight:700;font-size:15px}
  .note{color:var(--accent);font-size:12.5px;line-height:1.5;display:flex;gap:8px;margin:4px 2px;align-items:flex-start}
  .note .icn{width:15px;height:15px;margin-top:1px}
  input[type=date].hidden-date{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

  .profile-head{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 0}
  .profile-head .pa{width:74px;height:74px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent)}
  .profile-head .pa .icn{width:34px;height:34px;stroke-width:1.6}
  .profile-head .pn{font-size:18px;font-weight:700}
  .profile-head .pu{color:var(--muted);font-size:13px}
  .doc{color:var(--muted);font-size:14px;line-height:1.55}
  .doc p{margin-bottom:10px}

  #confettiRoot{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
  #confettiRoot i{position:absolute;top:-14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
  @keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--card2);color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:120;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  <!-- Навигация -->

  <!-- Настройки -->
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></symbol>

  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7.5h9M19 7.5h1"/><circle cx="16" cy="7.5" r="2.3"/><path d="M4 16.5h1M11 16.5h9"/><circle cx="8" cy="16.5" r="2.3"/></symbol>

  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M13.8 3.5H7a2.5 2.5 0 0 0-2.5 2.5v12A2.5 2.5 0 0 0 7 20.5h10a2.5 2.5 0 0 0 2.5-2.5V9.2z"/><path d="M13.8 3.5V9.2h5.7"/><path d="M9 13h6M9 16.5h6"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.7l7.5 2.9v6c0 4.9-3.2 8.3-7.5 9.9-4.3-1.6-7.5-5-7.5-9.9v-6z"/><path d="M9 11.6l2.2 2.2 4.3-4.6"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><path d="M20 12v8.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 20.5V12"/><rect x="2.5" y="7.5" width="19" height="4.5" rx="1"/><path d="M12 22V7.5"/><path d="M12 7.5H7.5a2.5 2.5 0 0 1 0-5C11 2.5 12 7.5 12 7.5z"/><path d="M12 7.5h4.5a2.5 2.5 0 0 0 0-5C13 2.5 12 7.5 12 7.5z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5v10"/><circle cx="12" cy="18.7" r="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 21.5c4.1 0 6.8-2.7 6.8-6.4 0-2.7-1.5-4.8-2.9-6.5-.6 1-1.4 1.7-2.3 2.1.2-2.9-1.1-5.6-3.6-7.2.3 2.4-.7 3.8-2 5.3-1.3 1.5-2.8 3.4-2.8 6.3 0 3.7 2.7 6.4 6.8 6.4z"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 4l1.9 5 5.1 1.5-5.1 1.5L12 17l-1.9-5L5 10.5 10.1 9z"/><path d="M19 16.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
  <symbol id="i-sleep" viewBox="0 0 24 24"><path d="M20.2 14.7A8.7 8.7 0 0 1 9.3 3.8a8.7 8.7 0 1 0 10.9 10.9z"/><path d="M15.5 4.5h4l-4 4h4"/></symbol>

  <!-- Утёнок для пустого списка задач -->
  <symbol id="i-duck" viewBox="0 0 64 64">
    <ellipse cx="35" cy="43" rx="20" ry="13.5" fill="#FFD34E"/>
    <circle cx="23" cy="22" r="12.5" fill="#FFD34E"/>
    <path d="M11.5 20.5L3.5 23l8 3z" fill="#F79E3D"/>
    <circle cx="20.5" cy="19" r="2" fill="#232a33"/>
    <path d="M30 41.5c3.5-3.5 9.5-3 12.5.5-2.5 4.5-10 4.5-12.5-.5z" fill="#F0B429"/>
    <path d="M47 33c3 1.5 5 4 5 7" stroke="#F0B429" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </symbol>
</svg>

<script>
/* ============ КОНФИГ ============ */
const CONFIG = {
  APP_NAME: "Просто Трекер",
  FOOTER: "@ProstoTrackerBot",
  SUPPORT_URL: ""
};
/* ================================ */

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const cloud = tg && tg.CloudStorage ? tg.CloudStorage : null;
const $ = s => document.querySelector(s);
const STORE_KEY = "prosto_tracker_v4";
const ic = (id, cls) => '<svg class="icn'+(cls?" "+cls:"")+'"><use href="#'+id+'"/></svg>';

const MONTHS_FULL=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_GRID=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
const MONTHS_SHORT=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const WD=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
const REPEATS=["once","daily","weekly","monthly"];
const REPEAT_LABEL={once:"Однократно",daily:"Ежедневно",weekly:"Еженедельно",monthly:"Ежемесячно"};
const JOURNALS={
  notes:{title:"Заметки",icon:"i-clip",ph:"Введите заметку..."},
  lesson:{title:"Урок дня",icon:"i-grad",ph:"Что нового ты узнал(а) сегодня?"},
  gratitude:{title:"Благодарность",icon:"i-heart",ph:"За что ты благодарен(на) сегодня?"},
  thoughts:{title:"Мысли",icon:"i-bulb",ph:"Запиши свои мысли..."}
};

const today=new Date();
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fromISO(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function startOfWeek(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML;}
function fmtDayLong(key){return cap(new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"short",year:"numeric"}).format(fromISO(key)))+".";}

let state={
  settings:{habitsDesc:false,habitsConfetti:true,goalsDesc:false,goalsSmart:false,goalsSubgoals:false,goalsConfetti:true,showHabits:true,showGoals:true,showAnalytics:true,notifications:false},
  tasks:[],habits:[],goals:[],
  journals:{notes:[],lesson:[],gratitude:[],thoughts:[]},
  updatedAt:0
};

function loadState(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){const p=JSON.parse(raw);if(p&&p.settings)state=Object.assign(state,p);}}catch(e){}
  if(!state.journals)state.journals={notes:[],lesson:[],gratitude:[],thoughts:[]};
  if(cloud&&cloud.getItem){try{cloud.getItem(STORE_KEY,(err,val)=>{if(!err&&val){try{const p=JSON.parse(val);if(p&&p.updatedAt&&p.updatedAt>state.updatedAt){state=Object.assign(state,p);if(!state.journals)state.journals={notes:[],lesson:[],gratitude:[],thoughts:[]};renderAll();}}catch(e){}}});}catch(e){}}
}
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}
  if(cloud&&cloud.setItem){try{cloud.setItem(STORE_KEY,JSON.stringify(state),()=>{});}catch(e){}}
}

const view={
  tab:"tasks",selectedDate:iso(today),calMonth:monthStart(today),calOpen:false,
  habitsMode:"month",period:monthStart(today),yearOpenHab:false,yearPickHab:today.getFullYear(),
  goalsYear:today.getFullYear(),anaMonth:monthStart(today),moreOpen:false
};

function occursOn(t,key){
  if(key<t.date)return false;
  if(t.repeat==="daily")return true;
  if(t.repeat==="weekly")return fromISO(key).getDay()===fromISO(t.date).getDay();
  if(t.repeat==="monthly")return fromISO(key).getDate()===fromISO(t.date).getDate();
  return key===t.date;
}
function tasksOn(key){
  const list=state.tasks.filter(t=>occursOn(t,key))
    .map(t=>({task:t,done:(t.doneDates||[]).includes(key)}))
    .sort((a,b)=>(b.task.important?1:0)-(a.task.important?1:0));
  return {list,total:list.length,done:list.filter(x=>x.done).length};
}
function habitMarksInMonth(h,y,m){return h.logs.filter(l=>{const d=fromISO(l);return d.getFullYear()===y&&d.getMonth()===m;}).length;}
function marksOn(key){return state.habits.filter(h=>h.logs.includes(key)).length;}
function anyCompletionOn(key){return state.tasks.some(t=>(t.doneDates||[]).includes(key))||state.habits.some(h=>h.logs.includes(key));}

function haptic(k){try{if(!tg||!tg.HapticFeedback)return;if(k==="success")tg.HapticFeedback.notificationOccurred("success");else tg.HapticFeedback.impactOccurred(k||"light");}catch(e){}}
let toastTimer=null;
function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1800);}
function confetti(){
  const root=$("#confettiRoot");const cols=["#f2c94c","#64a9dd","#e06c6c","#6fce8a","#d78bf0","#ffffff"];
  for(let i=0;i<70;i++){const p=document.createElement("i");const s=6+Math.random()*7;p.style.left=(Math.random()*100)+"vw";p.style.width=s+"px";p.style.height=s+"px";p.style.background=cols[i%cols.length];p.style.animationDelay=(Math.random()*0.35)+"s";root.appendChild(p);setTimeout(()=>p.remove(),2100);}
}

/* ================= РЕНДЕР ================= */
function renderAll(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.add("hidden"));
  $("#tab"+cap(view.tab)).classList.remove("hidden");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===view.tab));
  $("#navHabits").classList.toggle("hidden",!state.settings.showHabits);
  $("#navGoals").classList.toggle("hidden",!state.settings.showGoals);
  $("#navAnalytics").classList.toggle("hidden",!state.settings.showAnalytics);
  renderTopbar();
  if(view.tab==="tasks")renderTasks();
  if(view.tab==="habits")renderHabits();
  if(view.tab==="goals")renderGoals();
  if(view.tab==="analytics")renderAnalytics();
}

function renderTopbar(){
  const pt=$("#pillTop"),pb=$("#pillBottom"),cb=$("#calBtn");cb.classList.remove("hidden");
  if(view.tab==="tasks"){
    const d=fromISO(view.selectedDate),isT=view.selectedDate===iso(today);
    pt.textContent=isT?"Сегодня":cap(new Intl.DateTimeFormat("ru-RU",{weekday:"short",day:"numeric",month:"short"}).format(d));
    pb.textContent=isT?new Intl.DateTimeFormat("ru-RU",{weekday:"short",day:"numeric",month:"short"}).format(d):String(d.getFullYear());
  }else if(view.tab==="habits"){
    if(view.habitsMode==="week"){
      const mon=startOfWeek(view.period),sun=addDays(mon,6);
      pb.textContent=mon.getMonth()===sun.getMonth()?mon.getDate()+"–"+sun.getDate()+" "+MONTHS_SHORT[sun.getMonth()]:mon.getDate()+" "+MONTHS_SHORT[mon.getMonth()]+" – "+sun.getDate()+" "+MONTHS_SHORT[sun.getMonth()];
      pt.textContent="Неделя";
    }else{pt.textContent=MONTHS_FULL[view.period.getMonth()];pb.textContent=String(view.period.getFullYear());}
  }else if(view.tab==="goals"){pt.textContent=String(view.goalsYear);pb.textContent="год";}
  else{pt.textContent=MONTHS_FULL[view.anaMonth.getMonth()];pb.textContent=String(view.anaMonth.getFullYear());cb.classList.add("hidden");}
}

function renderTasks(){
  $("#calCard").classList.toggle("hidden",!view.calOpen);
  const y=view.calMonth.getFullYear(),m=view.calMonth.getMonth();
  $("#calTitle").textContent=MONTHS_FULL[m]+" "+y+"г.";
  $("#calWd").innerHTML=WD.map(w=>'<span class="cal-wd">'+w+"</span>").join("");
  const off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  let html="";for(let i=0;i<off;i++)html+="<span></span>";
  for(let dd=1;dd<=dim;dd++){
    const d=new Date(y,m,dd),k=iso(d),t=tasksOn(k);
    let cls="cal-day";if(d<today&&k!==iso(today))cls+=" past";if(k===iso(today))cls+=" today";if(k===view.selectedDate)cls+=" sel";
    html+='<button class="'+cls+'" data-date="'+k+'"><span class="n">'+dd+'</span><span class="c">'+(t.total?t.done+"/"+t.total:"0")+"</span></button>";
  }
  $("#calGrid").innerHTML=html;

  const s=tasksOn(view.selectedDate);
  $("#daySummary").textContent=s.done+" / "+s.total;

  const list=$("#taskList");
  if(!s.list.length){
    const isT=view.selectedDate===iso(today);
    list.innerHTML='<div class="empty">'+ic("i-duck")+(isT?"На сегодня задач нет":"На этот день задач нет")+"</div>";
  }else{
    list.innerHTML=s.list.map(x=>{
      const t=x.task;let mIc="";
      if(t.important)mIc+='<span class="t-ic imp">'+ic("i-alert")+"</span>";
      if(t.notify)mIc+='<span class="t-ic ntf">'+ic("i-bell")+"</span>";
      if(t.repeat&&t.repeat!=="once")mIc+='<span class="t-ic rpt">'+ic("i-repeat")+"</span>";
      return '<div class="task-row'+(x.done?" done":"")+'" data-id="'+t.id+'"><button class="chk">'+ic("i-check")+'</button><div class="t">'+mIc+esc(t.text)+'</div><button class="mini-del" data-del="'+t.id+'">'+ic("i-trash")+"</button></div>";
    }).join("");
  }
}

function renderHabits(){
  $("#yearCardHab").classList.toggle("hidden",!view.yearOpenHab);
  $("#segWeek").classList.toggle("active",view.habitsMode==="week");
  $("#segMonth").classList.toggle("active",view.habitsMode==="month");
  if(view.yearOpenHab){
    $("#yearTitleHab").textContent=view.yearPickHab;
    const pm=view.period.getMonth(),py=view.period.getFullYear();
    $("#yearGridHab").innerHTML=MONTHS_GRID.map((mn,i)=>'<button data-m="'+i+'" class="'+(i===pm&&view.yearPickHab===py?"cur":"")+'">'+mn+"</button>").join("");
  }
  const body=$("#habitsBody");
  if(!state.habits.length){body.innerHTML='<div class="empty">'+ic("i-sleep")+"Привычек пока что нет</div>";return;}
  if(view.habitsMode==="week"){
    const mon=startOfWeek(view.period);const days=[...Array(7)].map((_,i)=>addDays(mon,i));
    let html='<div class="wd-head">'+days.map((d,i)=>"<span>"+WD[i]+"<br>"+d.getDate()+"</span>").join("")+"</div>";
    html+=state.habits.map(h=>'<div class="h-row"><div class="h-name">'+esc(h.name)+(h.desc&&state.settings.habitsDesc?'<span class="cnt">'+esc(h.desc)+"</span>":"")+"</div>"+
      '<div class="h-dots">'+days.map(d=>{const k=iso(d);return '<button class="dot'+(h.logs.includes(k)?" on":"")+(d>today?" future":"")+'" data-hid="'+h.id+'" data-date="'+k+'">'+d.getDate()+"</button>";}).join("")+"</div></div>").join("");
    body.innerHTML=html;
  }else{
    const y=view.period.getFullYear(),m=view.period.getMonth(),dim=new Date(y,m+1,0).getDate();
    const isCur=y===today.getFullYear()&&m===today.getMonth();
    body.innerHTML=state.habits.map(h=>{const n=habitMarksInMonth(h,y,m);const doneToday=h.logs.includes(iso(today));
      return '<div class="h-row"><div class="h-name">'+esc(h.name)+(h.desc&&state.settings.habitsDesc?'<span class="cnt">'+esc(h.desc)+"</span>":"")+"</div>"+
      '<div class="h-month"><div class="bar"><i style="width:'+Math.round(n/dim*100)+'%"></i></div><span class="cnt" style="color:var(--muted);font-size:12px">'+n+"/"+dim+"</span>"+
      (isCur?'<button class="mark-btn'+(doneToday?" off":"")+'" data-hid="'+h.id+'">'+(doneToday?"✅":"Отметить")+"</button>":"")+"</div></div>";}).join("");
  }
}

function renderGoals(){
  const body=$("#goalsBody");const list=state.goals.filter(g=>g.year===view.goalsYear);
  if(!list.length){body.innerHTML='<div class="empty" style="color:var(--accent)">'+ic("i-target")+'<span style="color:var(--muted)">Целей на '+view.goalsYear+" год пока нет</span></div>";return;}
  body.innerHTML=list.map(g=>{
    const pct=Math.min(100,Math.round(g.progress/Math.max(1,g.target)*100));
    let html='<div class="goal"><div class="g-head"><span class="star">'+ic("i-star")+'</span><div class="tt">'+esc(g.title)+'</div><button class="mini-del" data-gdel="'+g.id+'">'+ic("i-trash")+"</button></div>";
    if(g.desc&&state.settings.goalsDesc)html+='<div class="g-desc">'+esc(g.desc)+"</div>";
    if(g.smart&&state.settings.goalsSmart)html+='<div class="g-desc">'+ic("i-target")+" "+esc(g.smart)+"</div>";
    html+='<div class="g-prog"><div class="bar"><i style="width:'+pct+'%"></i></div><span class="num">'+g.progress+"/"+g.target+"</span></div>";
    html+='<div class="g-ctrl"><button data-gminus="'+g.id+'">−</button><button data-gplus="'+g.id+'">+</button>';
    if(g.progress>=g.target)html+='<div class="done-tag">Выполнено 🎉</div>';
    html+="</div>";
    if(state.settings.goalsSubgoals&&g.subs&&g.subs.length){
      html+='<div class="subs">'+g.subs.map(s=>'<div class="sub'+(s.done?" done":"")+'"><button class="chk" data-sub="'+g.id+":"+s.id+'">'+ic("i-check")+'</button><span class="t">'+esc(s.text)+"</span></div>").join("")+"</div>";
    }
    return html+"</div>";
  }).join("");
}

function renderAnalytics(){
  const y=view.anaMonth.getFullYear(),m=view.anaMonth.getMonth(),dim=new Date(y,m+1,0).getDate();
  let tTotal=0,tDone=0;
  for(let dd=1;dd<=dim;dd++){const s=tasksOn(iso(new Date(y,m,dd)));tTotal+=s.total;tDone+=s.done;}
  let hMarks=0;state.habits.forEach(h=>hMarks+=habitMarksInMonth(h,y,m));
  const days=[...Array(7)].map((_,i)=>addDays(today,i-6));
  const vals=days.map(d=>{const k=iso(d);return tasksOn(k).done+marksOn(k);});
  const max=Math.max(1,...vals);
  let curStreak=0,d=new Date(today);while(anyCompletionOn(iso(d))){curStreak++;d=addDays(d,-1);}
  let best=0,cur=0;d=new Date(today);
  for(let i=0;i<180;i++){if(anyCompletionOn(iso(d))){cur++;if(cur>best)best=cur;}else cur=0;d=addDays(d,-1);}
  const tp=tTotal?Math.round(tDone/tTotal*100):0;
  $("#anaBody").innerHTML=
    '<div class="card"><div class="a-title">'+ic("i-tasks")+'Задачи за '+MONTHS_SHORT[m]+'</div><div class="a-big">'+tDone+" / "+tTotal+'</div><div class="a-bar"><i style="width:'+tp+'%"></i></div></div>'+
    '<div class="card"><div class="a-title">'+ic("i-repeat")+'Привычки за '+MONTHS_SHORT[m]+'</div><div class="a-big">'+hMarks+' отметок</div><div class="a-bar"><i style="width:'+Math.min(100,hMarks*4)+'%"></i></div></div>'+
    '<div class="card"><div class="a-title">'+ic("i-chart")+'Последние 7 дней</div><div class="bars">'+days.map((dd,i)=>'<div class="col"><div class="b" style="height:'+Math.round(vals[i]/max*80)+'%"></div><span class="l">'+WD[(dd.getDay()+6)%7]+"</span></div>").join("")+"</div></div>"+
    '<div class="card"><div class="a-title"><span style="color:#f79e3d;display:inline-flex">'+ic("i-fire")+'</span>Серия</div><div class="a-big">'+curStreak+' дн.</div><div class="a-title" style="margin:0">Лучшая серия: '+best+" дн.</div></div>";
}

/* ================= ОВЕРЛЕЙ ================= */
let ovStack=[];
let taskDraft=null;
function openScreen(name){ovStack.push(name);renderOverlay();$("#overlay").classList.remove("hidden");}
function backScreen(){ovStack.pop();if(ovStack.length)renderOverlay();else $("#overlay").classList.add("hidden");}

function row(iconId,bg,lt,val,kind,key){return '<button class="list-row" data-'+kind+'="'+key+'"><span class="li" style="background:'+bg+'">'+ic(iconId)+'</span><span class="lt">'+lt+'</span><span class="val">'+val+'</span><span class="arr">'+ic("i-chev-r")+"</span></button>";}
function prow(key,label){return '<div class="list-row"><div class="lt">'+label+"</div>"+sw(key,state.settings[key])+"</div>";}
function sw(key,on){return '<label class="switch"><input type="checkbox" data-sw="'+key+'"'+(on?" checked":"")+'><span class="sl"></span></label>';}

    '<div class="sec-title">Разделы меню</div><div class="list-card">'+prow("showHabits","Раздел «Привычки»")+prow("showGoals","Раздел «Цели»")+prow("showAnalytics","Раздел «Аналитика»")+"</div>"};},
  overdue(){
    const list=state.tasks.filter(t=>!t.doneDates.includes(t.date)&&t.date<iso(today)&&t.repeat==="once").sort((a,b)=>a.date<b.date?-1:1);
    return{title:"Просроченные задачи",html:!list.length?'<div class="card"><div class="empty">'+ic("i-sparkle")+"Просроченных задач нет</div></div>":

  terms(){return{title:"Соглашение",html:'<div class="card doc"><p>Используя приложение, ты соглашаешься использовать его для добрых целей: планировать задачи, укреплять привычки и достигать целей.</p><p>Приложение хранит данные локально на твоём устройстве и (при наличии) в облачном хранилище Telegram.</p></div>'};},
  privacy(){return{title:"Конфиденциальность",html:'<div class="card doc"><p>Мы не собираем и не передаём третьим лицам никакие персональные данные.</p><p>Задачи, привычки, цели и записи хранятся только в твоём Telegram-клиенте.</p></div>'};},

  addTask(){

    return{title:CONFIG.APP_NAME,html:

      '<div class="form-card"><textarea id="atText" rows="3" placeholder="Введите задачу">'+esc(d.text)+"</textarea></div>"+

      '<button class="list-row" id="atDateRow"><div class="lt">Дата</div><div class="val-pill">'+fmtDayLong(d.date)+'</div></button>'+
      '<button class="list-row" id="atRepeatRow"><div class="lt">Периодичность</div><div class="val-pill">'+REPEAT_LABEL[d.repeat]+'</div></button>'+
      '<div class="list-row"><div class="lt">Уведомление</div>'+sw("atNotify",d.notify)+'</div>'+
      '<div class="list-row"><div class="lt">Важная</div>'+sw("atImportant",d.important)+"</div></div>"+
      '<div class="note">'+ic("i-star")+'<span>Периодичность, уведомления и пометка «Важная» доступны бесплатно — подписка не нужна 🎉</span></div>'+
      '<input type="date" class="hidden-date" id="atDateInput" value="'+d.date+'">'+

  addHabit(){return{title:"Новая привычка",html:

    (state.settings.habitsDesc?'<label>Описание</label><input type="text" id="hfDesc" maxlength="80" placeholder="Краткое описание">':"")+
    '<button class="save-btn" type="submit">Сохранить</button></form>'};},

  addGoal(){return{title:"Новая цель на "+view.goalsYear,html:
    '<form class="form-card" id="goalForm"><label>Название</label><input type="text" id="gfTitle" maxlength="80" required placeholder="Например: прочитать 12 книг">'+
    (state.settings.goalsDesc?'<label>Описание</label><textarea id="gfDesc" rows="2" maxlength="200"></textarea>':"")+
    (state.settings.goalsSmart?'<label>Критерий успеха (SMART)</label><input type="text" id="gfSmart" maxlength="120" placeholder="Как пойму, что цель достигнута">':"")+
    '<label>Сколько шагов (целевое число)</label><input type="number" id="gfTarget" min="1" max="999" value="1">'+
    (state.settings.goalsSubgoals?'<label>Подцели (каждая с новой строки)</label><textarea id="gfSubs" rows="3" placeholder="Шаг 1&#10;Шаг 2"></textarea>':"")+
    '<button class="save-btn" type="submit">Сохранить</button></form>'};},

  journal(type){
    const J=JOURNALS[type];
    const entries=(state.journals[type]||[]).slice().sort((a,b)=>a.date<b.date?1:-1);

      '<div class="form-card"><textarea id="jText" rows="3" placeholder="'+J.ph+'"></textarea>'+

      '<button class="save-btn" id="jSave">Сохранить</button>'+

        '<div class="list-row"><div class="lt">'+esc(en.text)+'<div class="val">'+cap(new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"short",year:"numeric"}).format(fromISO(en.date)))+'</div></div><button class="mini-del" data-jdel="'+type+":"+en.id+'">'+ic("i-trash")+"</button></div>").join("")+"</div>":"")};}

function renderOverlay(){
  const cur=ovStack[ovStack.length-1];
  let name=cur,param=null;
  if(cur.indexOf("journal:")===0){name="journal";param=cur.split(":")[1];}
  const s=name==="journal"?SCREENS.journal(param):SCREENS[name]();
  $("#ovTitle").textContent=s.title;
  $("#ovBody").innerHTML=s.html;

  if(name==="addTask"){
    const ta=$("#atText");
    ta.addEventListener("input",()=>{taskDraft.text=ta.value;});
    $("#atDateRow").addEventListener("click",()=>{
      const inp=$("#atDateInput");
      try{if(inp.showPicker)inp.showPicker();else inp.classList.remove("hidden-date");}catch(e){inp.classList.remove("hidden-date");}
    });
    $("#atDateInput").addEventListener("change",e=>{if(e.target.value){taskDraft.date=e.target.value;renderOverlay();}});
    $("#atRepeatRow").addEventListener("click",()=>{
      taskDraft.repeat=REPEATS[(REPEATS.indexOf(taskDraft.repeat)+1)%REPEATS.length];
      haptic("light");renderOverlay();
    });
    $("#atSave").addEventListener("click",()=>{
      const text=taskDraft.text.trim();if(!text){toast("Введите задачу");return;}
      state.tasks.unshift({id:uid(),date:taskDraft.date,text:text,repeat:taskDraft.repeat,notify:taskDraft.notify,important:taskDraft.important,doneDates:[],createdAt:Date.now()});
      view.selectedDate=taskDraft.date;view.calMonth=monthStart(fromISO(taskDraft.date));
      persist();backScreen();renderAll();haptic("success");toast("Задача добавлена ✅");
    });
  }

  const hf=$("#habitForm");
  if(hf)hf.addEventListener("submit",e=>{
    e.preventDefault();const n=$("#hfName").value.trim();if(!n)return;
    state.habits.unshift({id:uid(),name:n,desc:($("#hfDesc")?$("#hfDesc").value.trim():""),logs:[],createdAt:Date.now()});
    persist();backScreen();renderAll();haptic("success");toast("Привычка добавлена 🔥");
  });

  const gf=$("#goalForm");
  if(gf)gf.addEventListener("submit",e=>{
    e.preventDefault();const t=$("#gfTitle").value.trim();if(!t)return;
    const target=Math.max(1,parseInt($("#gfTarget").value,10)||1);
    const subs=$("#gfSubs")?$("#gfSubs").value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>({id:uid(),text:x,done:false})) : [];
    state.goals.unshift({id:uid(),year:view.goalsYear,title:t,desc:$("#gfDesc")?$("#gfDesc").value.trim():"",smart:$("#gfSmart")?$("#gfSmart").value.trim():"",target:target,progress:0,subs:subs,celebrated:false,createdAt:Date.now()});
    persist();backScreen();renderAll();haptic("success");toast("Цель добавлена ⭐");
  });

  if(name==="journal"){
    $("#jSave").addEventListener("click",()=>{
      const txt=$("#jText").value.trim();if(!txt){toast("Введите текст");return;}
      if(!state.journals[param])state.journals[param]=[];
      state.journals[param].push({id:uid(),date:view.selectedDate,text:txt});
      persist();renderOverlay();haptic("success");toast("Сохранено");
    });
  }
}

/* ================= СОБЫТИЯ ================= */
$("#btnMenu").addEventListener("click",()=>{ovStack=["settings"];renderOverlay();$("#overlay").classList.remove("hidden");});
$("#btnCloseX").addEventListener("click",()=>{if(tg&&tg.close)tg.close();else toast("Мини-приложение");});
$("#ovBack").addEventListener("click",backScreen);
$("#ovClose").addEventListener("click",()=>{ovStack=[];$("#overlay").classList.add("hidden");});

$("#ovBody").addEventListener("click",e=>{
  const swEl=e.target.closest("[data-sw]");
  if(swEl){
    const k=swEl.dataset.sw;
    if(k==="atNotify"){taskDraft.notify=swEl.checked;return;}
    if(k==="atImportant"){taskDraft.important=swEl.checked;return;}
    state.settings[k]=swEl.checked;persist();
    if(["showHabits","showGoals","showAnalytics"].includes(k)){
      if(!state.settings.showHabits&&view.tab==="habits")view.tab="tasks";
      if(!state.settings.showGoals&&view.tab==="goals")view.tab="tasks";
      if(!state.settings.showAnalytics&&view.tab==="analytics")view.tab="tasks";
      renderAll();
    }
    haptic("light");return;
  }
  const jdel=e.target.closest("[data-jdel]");
  if(jdel){const p=jdel.dataset.jdel.split(":");state.journals[p[0]]=state.journals[p[0]].filter(x=>x.id!==p[1]);persist();renderOverlay();haptic("medium");return;}
  const t=e.target.closest("[data-open],[data-act],[data-ovdone],[data-ovmove]");
  if(!t)return;
  if(t.dataset.open){openScreen(t.dataset.open);return;}
  if(t.dataset.act==="support"){if(CONFIG.SUPPORT_URL&&tg&&tg.openLink)tg.openLink(CONFIG.SUPPORT_URL);else toast("Ссылка поддержки не настроена");return;}
  if(t.dataset.ovdone){const task=state.tasks.find(x=>x.id===t.dataset.ovdone);if(task){task.doneDates.push(task.date);persist();renderOverlay();renderAll();haptic("success");}return;}
  if(t.dataset.ovmove){const task=state.tasks.find(x=>x.id===t.dataset.ovmove);if(task){task.date=iso(today);persist();renderOverlay();renderAll();toast("Перенесено на сегодня");}return;}
});

$("#bottomNav").addEventListener("click",e=>{const b=e.target.closest(".nav-btn");if(!b)return;view.tab=b.dataset.tab;renderAll();haptic("light");});

$("#prevBtn").addEventListener("click",()=>shiftPeriod(-1));
$("#nextBtn").addEventListener("click",()=>shiftPeriod(1));
function shiftPeriod(dir){
  if(view.tab==="tasks"){const d=addDays(fromISO(view.selectedDate),dir);view.selectedDate=iso(d);view.calMonth=monthStart(d);}
  else if(view.tab==="habits"){if(view.habitsMode==="week")view.period=addDays(view.period,7*dir);else view.period=monthStart(new Date(view.period.getFullYear(),view.period.getMonth()+dir,1));}
  else if(view.tab==="goals")view.goalsYear+=dir;
  else view.anaMonth=monthStart(new Date(view.anaMonth.getFullYear(),view.anaMonth.getMonth()+dir,1));
  renderAll();haptic("light");
}
$("#pillBtn").addEventListener("click",()=>{if(view.tab==="habits"){view.yearOpenHab=!view.yearOpenHab;view.yearPickHab=view.period.getFullYear();renderAll();}});
$("#calBtn").addEventListener("click",()=>{
  if(view.tab==="tasks")view.calOpen=!view.calOpen;
  else if(view.tab==="habits"){view.yearOpenHab=!view.yearOpenHab;view.yearPickHab=view.period.getFullYear();}
  renderAll();
});

$("#calPrev").addEventListener("click",()=>{view.calMonth=monthStart(new Date(view.calMonth.getFullYear(),view.calMonth.getMonth()-1,1));renderTasks();});
$("#calNext").addEventListener("click",()=>{view.calMonth=monthStart(new Date(view.calMonth.getFullYear(),view.calMonth.getMonth()+1,1));renderTasks();});
$("#calGrid").addEventListener("click",e=>{const d=e.target.closest(".cal-day");if(!d)return;view.selectedDate=d.dataset.date;renderTasks();renderTopbar();haptic("light");});

$("#taskList").addEventListener("click",e=>{
  const del=e.target.closest("[data-del]");
  if(del){state.tasks=state.tasks.filter(t=>t.id!==del.dataset.del);persist();renderTasks();haptic("medium");return;}
  const rowEl=e.target.closest(".task-row");
  if(rowEl){
    const task=state.tasks.find(t=>t.id===rowEl.dataset.id);if(!task)return;
    const k=view.selectedDate;
    if(task.doneDates.includes(k))task.doneDates=task.doneDates.filter(x=>x!==k);
    else{task.doneDates.push(k);haptic("success");}
    persist();renderTasks();
  }
});

$("#addTaskBtn").addEventListener("click",()=>{taskDraft={date:view.selectedDate,text:"",repeat:"once",notify:false,important:false};openScreen("addTask");});

$("#moreBtn").addEventListener("click",()=>{
  view.moreOpen=!view.moreOpen;
  $("#morePanel").classList.toggle("hidden",!view.moreOpen);
  $("#moreBtn").classList.toggle("open",view.moreOpen);
  haptic("light");
});
$("#morePanel").addEventListener("click",e=>{
  const b=e.target.closest("[data-journal]");if(!b)return;
  openScreen("journal:"+b.dataset.journal);
});

$("#segWeek").addEventListener("click",()=>{view.habitsMode="week";view.period=startOfWeek(view.period);renderAll();});
$("#segMonth").addEventListener("click",()=>{view.habitsMode="month";view.period=monthStart(view.period);renderAll();});
$("#yearPrevHab").addEventListener("click",()=>{view.yearPickHab--;renderHabits();});
$("#yearNextHab").addEventListener("click",()=>{view.yearPickHab++;renderHabits();});
$("#yearGridHab").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;view.period=new Date(view.yearPickHab,parseInt(b.dataset.m,10),1);view.habitsMode="month";view.yearOpenHab=false;renderAll();});
$("#habitsBody").addEventListener("click",e=>{
  const dot=e.target.closest(".dot");
  if(dot){
    if(dot.classList.contains("future"))return;
    const h=state.habits.find(x=>x.id===dot.dataset.hid);if(!h)return;
    const k=dot.dataset.date;
    if(h.logs.includes(k))h.logs=h.logs.filter(l=>l!==k);
    else{h.logs.push(k);if(state.settings.habitsConfetti)confetti();}
    persist();renderHabits();haptic("success");return;
  }
  const mk=e.target.closest(".mark-btn");
  if(mk){
    const h=state.habits.find(x=>x.id===mk.dataset.hid);if(!h)return;
    const k=iso(today);
    if(!h.logs.includes(k)){h.logs.push(k);if(state.settings.habitsConfetti)confetti();haptic("success");}
    persist();renderHabits();
  }
});
$("#addHabitBtn").addEventListener("click",()=>openScreen("addHabit"));

$("#goalsBody").addEventListener("click",e=>{
  const gdel=e.target.closest("[data-gdel]");
  if(gdel){state.goals=state.goals.filter(g=>g.id!==gdel.dataset.gdel);persist();renderGoals();haptic("medium");return;}
  const plus=e.target.closest("[data-gplus]"),minus=e.target.closest("[data-gminus]"),sub=e.target.closest("[data-sub]");
  if(plus||minus){
    const id=plus?plus.dataset.gplus:minus.dataset.gminus;
    const g=state.goals.find(x=>x.id===id);if(!g)return;
    g.progress=Math.max(0,Math.min(g.target,g.progress+(plus?1:-1)));
    if(g.progress>=g.target&&!g.celebrated){g.celebrated=true;if(state.settings.goalsConfetti)confetti();}
    persist();renderGoals();haptic("success");return;
  }
  if(sub){
    const gid=sub.dataset.sub.split(":")[0],sid=sub.dataset.sub.split(":")[1];
    const g=state.goals.find(x=>x.id===gid);if(!g)return;
    const s=g.subs.find(x=>x.id===sid);if(!s)return;
    s.done=!s.done;persist();renderGoals();haptic("light");
  }
});
$("#addGoalBtn").addEventListener("click",()=>openScreen("addGoal"));

/* Инициализация */
document.querySelectorAll(".foot").forEach(f=>f.textContent=CONFIG.FOOTER);
if(tg){try{tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor("#17212b");if(tg.setBackgroundColor)tg.setBackgroundColor("#17212b");}catch(e){}}
const tgUser=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null;
if(tgUser&&tgUser.first_name)$("#avatarBtn").textContent=tgUser.first_name.charAt(0).toUpperCase();
loadState();
renderAll();
</script>
