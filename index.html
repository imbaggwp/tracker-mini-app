<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Просто Трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#17212b; --card:#1e2a36; --card2:#24313f; --line:#2c3a49; --navbg:#101820;
    --text:#eef4fa; --muted:#7f8e9c; --accent:#64a9dd;
    --ok:#6fce8a; --warn:#f2c94c; --danger:#e06c6c;
    color-scheme:dark;
  }
  html[data-theme="light"]{
    --bg:#eef3f7; --card:#ffffff; --card2:#e9eef4; --line:#d5dfe8; --navbg:#ffffff;
    --text:#17212b; --muted:#5c6b7a; --accent:#3f8ec7;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font:inherit}
  .hidden{display:none!important}

  .icn{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
  .round .icn{width:16px;height:16px;stroke-width:2.4}
  .nav-btn .icn{width:17px;height:17px;stroke-width:2}
  .segment .icn{width:15px;height:15px;stroke-width:2}
  .li .icn{width:16px;height:16px;stroke-width:2}
  .arr .icn{width:16px;height:16px;stroke-width:2.2}
  .wide-btn .icn{width:17px;height:17px;stroke-width:2.2}
  .more-btn .icn{width:16px;height:16px;stroke-width:2.2;transition:transform .2s}
  .more-btn.open .icn{transform:rotate(180deg)}
  .empty .icn{width:76px;height:76px;stroke-width:1.2;display:block;margin:0 auto 12px}
  .chk .icn{width:13px;height:13px;stroke-width:3.2}
  .sub .chk .icn{width:10px;height:10px}
  .mini-del .icn{width:16px;height:16px;stroke-width:1.7}
  .pencil .icn{width:16px;height:16px;stroke-width:1.8}
  .t-ic{display:inline-flex;margin-right:4px;vertical-align:-2px}
  .t-ic .icn{width:13px;height:13px;stroke-width:2.2}
  .t-ic.imp{color:var(--warn)} .t-ic.ntf{color:var(--accent)} .t-ic.rpt{color:var(--muted)}
  .star .icn{width:18px;height:18px;color:var(--warn);stroke-width:1.6}
  .li{color:#fff}
  .tagdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}

  .app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
  .h-title{font-size:20px;font-weight:700}
  .h-actions{display:flex;gap:6px}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}
  .icon-btn:active{background:var(--card2)}

  .topbar{display:flex;align-items:center;gap:8px;padding:4px 14px 12px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;overflow:hidden;cursor:pointer}
  .round{background:var(--card2);width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
  .pill{flex:1;max-width:190px;margin:0 auto;background:var(--card2);border-radius:14px;padding:7px 10px;text-align:center;line-height:1.25}
  .pill .t{display:block;color:var(--accent);font-size:13px;font-weight:600}
  .pill .b{display:block;color:var(--muted);font-size:11px}

  main{padding:0 14px 96px}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}

  .search-card{padding:12px}
  .search-card input{width:100%;background:var(--card2);border:none;outline:none;border-radius:12px;padding:11px 12px;color:var(--text);font-size:14px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--card2);color:var(--muted);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .chip.active{background:var(--accent);color:#0d1720}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-head .m{font-size:17px;font-weight:700}
  .cal-nav{display:flex;gap:4px}
  .cal-nav button{color:var(--accent);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .cal-nav .icn{width:16px;height:16px;stroke-width:2.4}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-wd{color:var(--muted);font-size:11px;text-align:center;padding:6px 0}
  .cal-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px}
  .cal-day .n{font-size:15px;font-weight:600;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .cal-day .c{font-size:10px;color:var(--muted)}
  .cal-day.past{opacity:.45}
  .cal-day.today .n{background:var(--card2);color:var(--accent)}
  .cal-day.sel .n{background:var(--accent);color:#0d1720}
  .cal-day:active{background:var(--card2)}

  .summary{display:flex;justify-content:flex-end;align-items:center;padding:14px 18px}
  .summary .v{font-size:22px;font-weight:800}

  .cnt-row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .cnt-row .ci{font-size:17px;width:24px;text-align:center}
  .cnt-row .cn{width:64px;font-size:13px;color:var(--muted)}
  .cnt-row .bar{flex:1;height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
  .cnt-row .bar i{display:block;height:100%;background:var(--accent)}
  .cnt-row .cv{width:74px;text-align:right;font-size:12.5px;font-weight:700}
  .cnt-btn{width:30px;height:30px;border-radius:10px;background:var(--card2);font-weight:800;font-size:15px;flex:none}

  .task-row{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:12px;margin-bottom:8px}
  .task-wrap .subs{background:var(--card2);border-radius:0 0 14px 14px;margin:-4px 0 8px;padding:4px 12px 10px}
  .task-wrap .task-row{margin-bottom:0}
  .task-wrap.has-subs .task-row{border-radius:14px 14px 0 0}
  .chk{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:transparent}
  .task-row.done .chk{background:var(--accent);border-color:var(--accent);color:#0d1720}
  .task-row.done .t{opacity:.55;text-decoration:line-through}
  .task-row .t{flex:1;word-break:break-word;font-size:15px}
  .task-row .t .desc{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
  .task-row.flash{animation:flashRow 1.4s}
  @keyframes flashRow{0%{background:var(--accent);color:#0d1720}70%{background:var(--accent)}100%{}}
  .mini-del{color:var(--muted);padding:4px;display:flex}
  .empty{text-align:center;color:var(--muted);padding:22px 0;font-size:14px}

  .wide-btn{width:100%;background:var(--card);border-radius:16px;padding:15px;font-weight:600;font-size:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:9px}
  .wide-btn:active{background:var(--card2)}
  .btn-row{display:flex;gap:10px}
  .btn-row .wide-btn{flex:1}
  .more-btn{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;font-size:15px}

  .segment{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
  .segment button{flex:1;padding:10px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
  .segment button.active{background:var(--card2);color:var(--accent)}

  .year-head{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
  .year-head .y{font-size:17px;font-weight:700}
  .year-head button{color:var(--accent);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .year-head .icn{width:16px;height:16px;stroke-width:2.4}
  .months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .months-grid button{background:var(--card2);border-radius:12px;padding:12px 0;color:var(--muted);font-weight:600;font-size:14px}
  .months-grid button.cur{background:#2b4a66;color:var(--accent)}
  .wd-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
  .wd-head span{color:var(--muted);font-size:10px;text-align:center}
  .h-row{background:var(--card2);border-radius:14px;padding:12px;margin-bottom:8px}
  .h-name{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
  .h-name .cnt{color:var(--muted);font-weight:500;font-size:12px;flex:none}
  .h-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dot{height:34px;border-radius:10px;background:var(--card);color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .dot.on{background:var(--accent);color:#0d1720}
  .dot.future{opacity:.3}
  .h-month{display:flex;align-items:center;gap:10px}
  .h-month .bar{flex:1;height:8px;border-radius:4px;background:var(--card);overflow:hidden}
  .h-month .bar i{display:block;height:100%;background:var(--accent)}
  .mark-btn{background:var(--accent);color:#0d1720;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;flex:none}
  .mark-btn.off{background:var(--card);color:var(--muted)}

  .goal{background:var(--card2);border-radius:14px;padding:14px;margin-bottom:10px}
  .g-head{display:flex;align-items:flex-start;gap:10px}
  .g-head .tt{flex:1;font-weight:700;font-size:15px}
  .g-desc{color:var(--muted);font-size:13px;margin:6px 0 0 28px}
  .g-prog{display:flex;align-items:center;gap:10px;margin:12px 0 8px}
  .g-prog .bar{flex:1;height:8px;border-radius:4px;background:var(--card);overflow:hidden}
  .g-prog .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .g-prog .num{font-weight:700;font-size:13px;color:var(--accent);flex:none}
  .g-ctrl{display:flex;gap:8px}
  .g-ctrl button{background:var(--card);border-radius:10px;width:40px;height:34px;font-size:17px;font-weight:700}
  .g-ctrl .done-tag{flex:1;text-align:center;color:var(--ok);font-weight:700;align-self:center}
  .subs{margin-top:10px}
  .sub{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
  .sub .chk{width:20px;height:20px;border-width:2px}
  .sub.done .chk{background:var(--accent);border-color:var(--accent);color:#0d1720}
  .sub.done .t{opacity:.55;text-decoration:line-through}

  .a-title{font-size:14px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .a-title .icn{width:15px;height:15px;stroke-width:2}
  .a-big{font-size:24px;font-weight:800;margin-bottom:10px}
  .a-bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
  .a-bar i{display:block;height:100%;background:var(--accent)}
  .delta{font-size:12.5px;font-weight:700;margin-left:6px}
  .delta.up{color:var(--ok)} .delta.down{color:var(--danger)} .delta.flat{color:var(--muted)}
  .bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
  .bars .c{font-size:9.5px;color:var(--muted);white-space:nowrap}
  .bars .b{width:100%;border-radius:6px;background:var(--accent);min-height:4px}
  .bars .l{font-size:10px;color:var(--muted);white-space:nowrap}
  .bars .col.hot .l{color:var(--accent);font-weight:700}
  .hm{display:grid;grid-template-rows:repeat(7,9px);grid-auto-flow:column;gap:3px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .hm i{width:9px;height:9px;border-radius:2.5px;background:var(--card2)}
  .ana-stats{display:flex;align-items:center;gap:16px}
  .ring-wrap{position:relative;width:104px;height:104px;flex:none}
  .ring-wrap svg{width:104px;height:104px;transform:rotate(-90deg)}
  .ring-wrap .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
  .st-rows{flex:1}
  .st-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3.5px 0}
  .st-row .v{font-weight:700}

  .bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px}
  .nav-btn .nb-ic{width:34px;height:30px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:inherit}
  .nav-btn.active{color:var(--accent)}
  .nav-btn.active .nb-ic{background:var(--accent);color:#0d1720}

  .foot{text-align:center;color:var(--muted);font-size:13px;padding:6px 0 2px}

  .overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
  .ov-header{display:flex;align-items:center;gap:8px;padding:14px 12px 10px}
  .ov-header .t{flex:1;font-size:18px;font-weight:700;text-align:center;margin-right:76px}
  .ov-body{flex:1;overflow-y:auto;padding:4px 14px 30px}
  .ov-title-big{text-align:center;font-size:18px;font-weight:700;margin:14px 0 18px}
  .sec-title{color:var(--accent);font-size:14px;font-weight:600;margin:16px 2px 8px}
  .list-card{background:var(--card);border-radius:16px;overflow:hidden}
  .list-card.solo{margin-bottom:12px}
  .list-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;font-size:15px}
  .list-row + .list-row{border-top:1px solid var(--line)}
  .list-row .li{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
  .list-row .lt{flex:1}
  .list-row .val{color:var(--muted);font-size:13.5px;text-align:right}
  .list-row .arr{color:var(--muted);display:flex}
  .pencil{color:var(--accent);display:flex;padding:2px}
  .clr{color:var(--muted);display:flex;padding:2px}
  .clr .icn{width:14px;height:14px;stroke-width:2.2}
  .val-pill{background:var(--card2);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;flex:none;display:flex;align-items:center}
  .switch{position:relative;width:46px;height:27px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
  .switch .sl{position:absolute;inset:0;border-radius:14px;background:#3a4753;transition:.2s}
  .switch .sl::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked + .sl{background:var(--accent)}
  .switch input:checked + .sl::after{transform:translateX(19px)}

  .time-row{display:flex;align-items:center;gap:10px;padding:0 14px 14px}
  .time-row input{flex:1;background:var(--card2);border:none;outline:none;border-radius:12px;padding:14px;text-align:center;font-size:18px;font-weight:600;color:var(--text)}
  .time-row .colon{color:var(--muted);font-size:18px;font-weight:700}
  .notif-card.dimmed .time-row{opacity:.45;pointer-events:none}

  .form-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
  .form-card textarea,.form-card input[type=text],.form-card input[type=number]{width:100%;background:var(--card2);border:none;outline:none;border-radius:12px;padding:12px;color:var(--text);font-size:15px;resize:vertical}
  .form-card label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  .save-btn{width:100%;margin-top:6px;background:var(--accent);color:#0d1720;border-radius:14px;padding:14px;font-weight:700;font-size:15px}
  .note{color:var(--accent);font-size:12.5px;line-height:1.5;display:flex;gap:8px;margin:4px 2px;align-items:flex-start}
  .note .icn{width:15px;height:15px;margin-top:1px}
  input[type=date].hidden-date{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .code{background:var(--card2);border-radius:12px;padding:12px;font-size:10.5px;line-height:1.5;overflow:auto;max-height:320px;white:space:pre;white-space:pre;color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace}
  .doc{color:var(--muted);font-size:14px;line-height:1.55}
  .doc p{margin-bottom:10px}

  #confettiRoot{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
  #confettiRoot i{position:absolute;top:-14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
  @keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--card2);color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:120;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.7" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5.5"/><path d="M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
  <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.8l4.3 4.4L19 7.2"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15"/><path d="M9.2 6.5V5.2A1.7 1.7 0 0 1 10.9 3.5h2.2a1.7 1.7 0 0 1 1.7 1.7v1.3"/><path d="M6.7 6.5l.9 12a2 2 0 0 0 2 1.9h4.8a2 2 0 0 0 2-1.9l.9-12"/><path d="M10 10.5v6M14 10.5v6"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l4.6-.9L20 7.7a2 2 0 0 0 0-2.8l-.9-.9a2 2 0 0 0-2.8 0L4.9 15.4z"/><path d="M13.6 6.6l3.8 3.8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1.3" fill="currentColor" stroke="none"/></symbol>

const today=new Date();
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fromISO(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function startOfWeek(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(x){const d=document.createElement("div");d.textContent=x;return d.innerHTML;}
function fmtDayLong(key){return cap(new Intl.DateTimeFormat(state.settings.lang==="en"?"en-US":"ru-RU",{day:"numeric",month:"short",year:"numeric"}).format(fromISO(key)))+".";}
function fmtShort(d){return new Intl.DateTimeFormat(state.settings.lang==="en"?"en-US":"ru-RU",{day:"numeric",month:"short"}).format(d);}
function isoWeek(dt){const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);}
function sameWeek(a,b){return +startOfWeek(fromISO(a))===+startOfWeek(fromISO(b));}

function initProfile(){
  if(!state.profile)state.profile={name:"",email:"",tz:"",registeredAt:""};
  if(!state.profile.name&&tgUser)state.profile.name=((tgUser.first_name||"")+(tgUser.last_name?" "+tgUser.last_name:"")).trim();
  if(!state.profile.tz){try{state.profile.tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Moscow";}catch(e){state.profile.tz="Europe/Moscow";}}
  if(!state.profile.registeredAt)state.profile.registeredAt=iso(today);
  if(!state.counters)state.counters={water:{},steps:{},sleep:{}};
  if(!state.freezes)state.freezes=[];
}
function loadState(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){const p=JSON.parse(raw);if(p&&p.settings)state=Object.assign(state,p);}}catch(e){}
  if(!state.journals)state.journals={notes:[],lesson:[],gratitude:[],thoughts:[]};
  initProfile();
}
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}
  if(cloud&&cloud.setItem){try{cloud.setItem(STORE_KEY,JSON.stringify(state),()=>{state.syncAt=Date.now();});}catch(e){}}
}
function pullCloud(cb){
  if(!cloud||!cloud.getItem){toast(t("never"));return;}
  cloud.getItem(STORE_KEY,(err,val)=>{
    if(!err&&val){try{const p=JSON.parse(val);if(p&&p.updatedAt){state=Object.assign(state,p);initProfile();persist();renderAll();applyI18n();toast("☁️ OK");}}catch(e){}}
    else toast("☁️ —");
    if(cb)cb();
  });
}

function applyTheme(){
  let th=state.settings.theme;
  if(th==="auto"){try{th=(tg&&tg.colorScheme)|| (window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");}catch(e){th="dark";}}
  document.documentElement.dataset.theme=th==="light"?"light":"dark";
}

/* ---------- данные ---------- */
function occursOn(tsk,key){
  if(key<tsk.date)return false;
  if(tsk.repeat==="daily")return true;
  if(tsk.repeat==="weekly")return fromISO(key).getDay()===fromISO(tsk.date).getDay();
  if(tsk.repeat==="monthly")return fromISO(key).getDate()===fromISO(tsk.date).getDate();
  return key===tsk.date;
}
function tasksOn(key){
  const list=state.tasks.filter(x=>occursOn(x,key))
    .map(x=>({task:x,done:(x.doneDates||[]).includes(key)}))
    .sort((a,b)=>(b.task.important?1:0)-(a.task.important?1:0));
  return {list,total:list.length,done:list.filter(x=>x.done).length};
}
function habitActiveOn(h,k){return (h.start||k)<=k&&(!h.end||h.end>=k);}
function habitMarksInMonth(h,y,m){return h.logs.filter(l=>{const d=fromISO(l);return d.getFullYear()===y&&d.getMonth()===m;}).length;}
function marksOn(key){return state.habits.filter(h=>h.logs.includes(key)).length;}
function anyCompletionOn(key){return state.tasks.some(x=>(x.doneDates||[]).includes(key))||state.habits.some(h=>h.logs.includes(key));}
function dayOk(k){return anyCompletionOn(k)||state.freezes.includes(k);}
function canFreeze(k){return !state.freezes.includes(k)&&!state.freezes.some(f=>sameWeek(f,k));}
function activityOn(k){return tasksOn(k).done+marksOn(k);}

function haptic(k){try{if(!tg||!tg.HapticFeedback)return;if(k==="success")tg.HapticFeedback.notificationOccurred("success");else tg.HapticFeedback.impactOccurred(k||"light");}catch(e){}}
let toastTimer=null;
function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1800);}
function confetti(){
  const root=$("#confettiRoot");const cols=["#f2c94c","#64a9dd","#e06c6c","#6fce8a","#d78bf0","#ffffff"];
  for(let i=0;i<70;i++){const p=document.createElement("i");const s=6+Math.random()*7;p.style.left=(Math.random()*100)+"vw";p.style.width=s+"px";p.style.height=s+"px";p.style.background=cols[i%cols.length];p.style.animationDelay=(Math.random()*0.35)+"s";root.appendChild(p);setTimeout(()=>p.remove(),2100);}
}

function renderTopbar(){
  const pt=$("#pillTop"),pb=$("#pillBottom"),cb=$("#calBtn");cb.classList.remove("hidden");
  if(view.tab==="tasks"){
    const d=fromISO(view.selectedDate),isT=view.selectedDate===iso(today);
    pt.textContent=isT?t("today"):cap(new Intl.DateTimeFormat(state.settings.lang==="en"?"en-US":"ru-RU",{weekday:"short",day:"numeric",month:"short"}).format(d));
    pb.textContent=isT?fmtShort(d):String(d.getFullYear());
  }else if(view.tab==="habits"){
    if(view.habitsMode==="week"){
      const mon=startOfWeek(view.period),sun=addDays(mon,6);
      pb.textContent=fmtShort(mon)+" – "+fmtShort(sun);pt.textContent=t("week");
    }else{pt.textContent=mF()[view.period.getMonth()];pb.textContent=String(view.period.getFullYear());}
  }else if(view.tab==="goals"){pt.textContent=String(view.goalsYear);pb.textContent=t("year");}
  else{
    cb.classList.add("hidden");
    if(view.anaPeriod==="week"){const mon=startOfWeek(view.anaDate),sun=addDays(mon,6);pt.textContent=isoWeek(mon)+" "+t("week").toLowerCase();pb.textContent=fmtShort(mon)+" – "+fmtShort(sun);}
    else if(view.anaPeriod==="month"){pt.textContent=mF()[view.anaDate.getMonth()];pb.textContent=String(view.anaDate.getFullYear());}
    else{pt.textContent=String(view.anaDate.getFullYear());pb.textContent=t("year");}
  }
}

/* ---------- аналитика ---------- */
function bucketsFor(anchor,period){
  const b=[];
  if(period==="week"){const mon=startOfWeek(anchor);for(let i=0;i<7;i++)b.push({label:wd()[i],days:[addDays(mon,i)]});}
  else if(period==="month"){const y=anchor.getFullYear(),m=anchor.getMonth(),dim=new Date(y,m+1,0).getDate();
    for(let w=0;w<Math.ceil(dim/7);w++){const days=[];for(let dd=w*7+1;dd<=Math.min(dim,(w+1)*7);dd++)days.push(new Date(y,m,dd));b.push({label:(w*7+1)+"–"+Math.min(dim,(w+1)*7),days});}}
  else{const y=anchor.getFullYear();for(let m=0;m<12;m++){const dim=new Date(y,m+1,0).getDate();const days=[];for(let dd=1;dd<=dim;dd++)days.push(new Date(y,m,dd));b.push({label:mG()[m],days});}}
  return b;
}
function agg(buckets){
  let total=0,done=0,marks=0,expected=0;
  const per=buckets.map(bk=>{let bT=0,bD=0,bM=0;
    bk.days.forEach(d=>{const k=iso(d);const s=tasksOn(k);bT+=s.total;bD+=s.done;bM+=marksOn(k);if(d<=today)expected+=state.habits.filter(h=>habitActiveOn(h,k)).length;});
    total+=bT;done+=bD;marks+=bM;return{label:bk.label,t:bT,d:bD,m:bM};});
  return {per,total,done,marks,expected};
}
function prevAnchor(anchor,period){
  if(period==="week")return addDays(anchor,-7);
  if(period==="month")return monthStart(new Date(anchor.getFullYear(),anchor.getMonth()-1,1));
  return new Date(anchor.getFullYear()-1,0,1);
}
function renderAnalytics(){
  const mode=view.anaMode,period=view.anaPeriod;
  const A=agg(bucketsFor(view.anaDate,period));
  const P=agg(bucketsFor(prevAnchor(view.anaDate,period),period));
  const cur=mode==="tasks"?A.done:A.marks, prev=mode==="tasks"?P.done:P.marks;
  const delta=prev>0?Math.round((cur-prev)/prev*100):(cur>0?100:0);
  const dCls=delta>0?"up":delta<0?"down":"flat";
  const dArrow=delta>0?"▲":delta<0?"▼":"•";
  const pct=mode==="tasks"?(A.total?Math.round(A.done/A.total*100):0):(A.expected?Math.round(A.marks/A.expected*100):0);

  let bestI=-1,bestV=0;
  A.per.forEach((p,i)=>{const v=mode==="tasks"?p.d:p.m;if(v>bestV){bestV=v;bestI=i;}});
  let prod="—";if(bestI>=0){prod=A.per[bestI].label;if(period==="week")prod=cap(prod.toLowerCase());}

  const rows=mode==="tasks"?[
    [t("totalTasks"),A.total],[t("completed"),A.done],[t("notCompleted"),A.total-A.done],[t("avgProgress"),pct+"%"],[t("prodDay"),prod]
  ]:[
    [t("totalHabits"),state.habits.length],[t("marks"),A.marks],[t("expected"),A.expected],[t("avgProgress"),pct+"%"],[t("prodDay"),prod]
  ];

  const C=2*Math.PI*34;
  const ring='<div class="ring-wrap"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" stroke="var(--card2)" stroke-width="9" fill="none"/><circle cx="40" cy="40" r="34" stroke="var(--accent)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct/100))+'"/></svg><div class="pct">'+pct+'%</div></div>';

  const max=Math.max(1,...A.per.map(p=>mode==="tasks"?p.d:p.m));
  const chart='<div class="bars">'+A.per.map((p,i)=>{const v=mode==="tasks"?p.d:p.m;
    const counter=mode==="tasks"?(p.d+"/"+p.t):(p.m+"/"+state.habits.length);
    return '<div class="col'+(i===bestI?" hot":"")+'"><span class="c">'+counter+'</span><div class="b" style="height:'+Math.round(v/max*72)+'%"></div><span class="l">'+p.label+"</span></div>";}).join("")+"</div>";

  /* тепловая карта года */
  const start=addDays(today,-364);const sw=startOfWeek(start);
  let hm="";
  for(let d=new Date(sw);d<=today;d=addDays(d,1)){
    const n=activityOn(iso(d));
    const a=n===0?"":n===1?"33":n===2?"55":n<=4?"78":"100";
    hm+='<i style="'+(a?"background:color-mix(in srgb, var(--accent) "+a+"%, var(--card2))":"")+'"></i>';
  }

  /* серия + заморозка */
  let curStreak=0,d=new Date(today);
  while(dayOk(iso(d))){curStreak++;d=addDays(d,-1);}
  let best=0,cur=0;d=new Date(today);
  for(let i=0;i<365;i++){if(dayOk(iso(d))){cur++;if(cur>best)best=cur;}else cur=0;d=addDays(d,-1);}
  const tk=iso(today);
  const freezeBtn=(!dayOk(tk)&&canFreeze(tk))?'<button class="wide-btn" id="freezeBtn" style="margin:10px 0 0">'+ic("i-snow")+t("useFreeze")+"</button>":"";

  $("#anaBody").innerHTML=
    '<div class="segment"><button data-anamode="tasks" class="'+(mode==="tasks"?"active":"")+'">'+ic("i-tasks")+t("tasks")+'</button><button data-anamode="habits" class="'+(mode==="habits"?"active":"")+'">'+ic("i-repeat")+t("habits")+"</button></div>"+
    '<div class="segment"><button data-anaperiod="week" class="'+(period==="week"?"active":"")+'">'+t("week")+'</button><button data-anaperiod="month" class="'+(period==="month"?"active":"")+'">'+t("month")+'</button><button data-anaperiod="year" class="'+(period==="year"?"active":"")+'">'+t("year")+"</button></div>"+
    '<div class="card"><div class="ana-stats">'+ring+'<div class="st-rows">'+rows.map(r=>'<div class="st-row"><span>'+r[0]+'</span><span class="v">'+r[1]+"</span></div>").join("")+
    '<div class="st-row"><span>'+t("dynamics")+'</span><span class="v"><span class="delta '+dCls+'">'+dArrow+" "+Math.abs(delta)+"%</span></span></div>"+
    "</div></div></div>"+
    '<div class="card">'+chart+"</div>"+
    '<div class="card"><div class="a-title">'+ic("i-fire")+t("streak")+'</div><div class="a-big">'+curStreak+" "+t("days")+'</div><div class="a-title" style="margin:0">'+t("bestStreak")+": "+best+" "+t("days")+"</div>"+freezeBtn+"</div>"+
    '<div class="card"><div class="a-title">'+ic("i-cal")+t("heatmap")+'</div><div class="hm">'+hm+"</div></div>";

  const fb=$("#freezeBtn");
  if(fb)fb.addEventListener("click",()=>{state.freezes.push(tk);persist();renderAnalytics();haptic("success");toast("🧊 OK");});
}

    $("#hbText").addEventListener("input",e=>{habitDraft.name=e.target.value;});
    const de=$("#hbDesc");if(de)de.addEventListener("input",e=>{habitDraft.desc=e.target.value;});
    const pick=(b,i,cb)=>{$(b).addEventListener("click",()=>{const inp=$(i);try{if(inp.showPicker)inp.showPicker();else inp.classList.remove("hidden-date");}catch(e){inp.classList.remove("hidden-date");}});$(i).addEventListener("change",e=>{if(e.target.value){cb(e.target.value);renderOverlay();}});};
    pick("#hbStartRow","#hbStartInput",v=>{habitDraft.start=v;});
    pick("#hbEndRow","#hbEndInput",v=>{habitDraft.end=v;});
    const clr=$("#hbEndClear");if(clr)clr.addEventListener("click",e=>{e.stopPropagation();habitDraft.end="";renderOverlay();});
    $("#hbRepeatRow").addEventListener("click",()=>{habitDraft.repeat=H_REPEATS[(H_REPEATS.indexOf(habitDraft.repeat)+1)%H_REPEATS.length];haptic("light");renderOverlay();});
    $("#hbSave").addEventListener("click",()=>{
      const n=habitDraft.name.trim();if(!n){toast(t("enterHabit"));return;}
      state.habits.unshift({id:uid(),name:n,desc:habitDraft.desc||"",start:habitDraft.start,end:habitDraft.end,repeat:habitDraft.repeat,notify:habitDraft.notify,logs:[],createdAt:Date.now()});
      persist();backScreen();renderAll();haptic("success");
    });
  }
  if(name==="notif"){
    const save=()=>{state.settings.morningTime=pad2($("#mH").value,23)+":"+pad2($("#mM").value,59);state.settings.eveningTime=pad2($("#eH").value,23)+":"+pad2($("#eM").value,59);persist();};
    ["mH","mM","eH","eM"].forEach(id=>{const el=$("#"+id);if(el)el.addEventListener("input",()=>{el.value=el.value.replace(/\D/g,"").slice(0,2);save();});});
  }
  const gf=$("#goalForm");
  if(gf)gf.addEventListener("submit",e=>{
    e.preventDefault();const tt=$("#gfTitle").value.trim();if(!tt)return;
    const target=Math.max(1,parseInt($("#gfTarget").value,10)||1);
    const subs=$("#gfSubs")?$("#gfSubs").value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>({id:uid(),text:x,done:false})) : [];
    state.goals.unshift({id:uid(),year:view.goalsYear,title:tt,desc:$("#gfDesc")?$("#gfDesc").value.trim():"",smart:$("#gfSmart")?$("#gfSmart").value.trim():"",target:target,progress:0,subs:subs,celebrated:false,createdAt:Date.now()});
    persist();backScreen();renderAll();haptic("success");
  });
  if(name==="journal"){
    $("#jSave").addEventListener("click",()=>{
      const txt=$("#jText").value.trim();if(!txt)return;
      if(!state.journals[param])state.journals[param]=[];
      state.journals[param].push({id:uid(),date:view.selectedDate,text:txt});
      persist();renderOverlay();haptic("success");
    });
  }
}

/* ================= СОБЫТИЯ ================= */
$("#btnMenu").addEventListener("click",()=>{ovStack=["settings"];renderOverlay();$("#overlay").classList.remove("hidden");});
$("#btnCloseX").addEventListener("click",()=>{if(tg&&tg.close)tg.close();});
$("#ovBack").addEventListener("click",backScreen);
$("#ovClose").addEventListener("click",()=>{ovStack=[];$("#overlay").classList.add("hidden");});
$("#avatarBtn").addEventListener("click",()=>openScreen("profile"));

$("#ovBody").addEventListener("click",e=>{
  const swEl=e.target.closest("[data-sw]");
  if(swEl){
    const k=swEl.dataset.sw;
    if(k==="atNotify"){taskDraft.notify=swEl.checked;return;}
    if(k==="atImportant"){taskDraft.important=swEl.checked;return;}
    if(k==="hbNotify"){habitDraft.notify=swEl.checked;return;}
    state.settings[k]=swEl.checked;persist();
    if(["showHabits","showGoals","showAnalytics"].includes(k)){
      if(!state.settings.showHabits&&view.tab==="habits")view.tab="tasks";
      if(!state.settings.showGoals&&view.tab==="goals")view.tab="tasks";
      if(!state.settings.showAnalytics&&view.tab==="analytics")view.tab="tasks";
      renderAll();
    }
    if(k==="morningOn"||k==="eveningOn")renderOverlay();
    if(["showMore","tasksOverdue"].includes(k))renderAll();
    haptic("light");return;
  }
  const ed=e.target.closest("[data-edit]");
  if(ed){
    if(ed.dataset.edit==="lang"){state.settings.lang=state.settings.lang==="ru"?"en":"ru";persist();applyI18n();renderOverlay();renderAll();return;}
    openScreen("edit:"+ed.dataset.edit);return;
  }
  const jdel=e.target.closest("[data-jdel]");
  if(jdel){const p=jdel.dataset.jdel.split(":");state.journals[p[0]]=state.journals[p[0]].filter(x=>x.id!==p[1]);persist();renderOverlay();return;}
  const tpl=e.target.closest("[data-tpl]");
  if(tpl){
    const L=state.settings.lang||"ru";const tp=TEMPLATES[parseInt(tpl.dataset.tpl,10)];
    tp.tasks[L].forEach(tx=>state.tasks.unshift({id:uid(),date:view.selectedDate,text:tx,desc:"",repeat:"once",notify:false,important:false,tag:"",subs:[],doneDates:[],createdAt:Date.now()}));
    persist();backScreen();renderAll();toast(t("tplAdded"));return;
  }
  const t2=e.target.closest("[data-open],[data-act],[data-ovdone],[data-ovmove]");
  if(!t2)return;
  if(t2.dataset.open){openScreen(t2.dataset.open);return;}
  const act=t2.dataset.act;
  if(act==="support"){if(CONFIG.SUPPORT_URL&&tg&&tg.openLink)tg.openLink(CONFIG.SUPPORT_URL);else toast(CONFIG.SUPPORT_URL?"":"—");return;}
  if(act==="theme"){state.settings.theme=state.settings.theme==="auto"?"dark":state.settings.theme==="dark"?"light":"auto";persist();applyTheme();renderOverlay();return;}
  if(act==="syncUp"){persist();state.syncAt=Date.now();persist();toast("☁️ OK");renderOverlay();return;}
  if(act==="syncDown"){pullCloud();renderOverlay();return;}
  if(act==="copyWorker"){try{navigator.clipboard.writeText(WORKER_CODE).then(()=>toast(t("copied")));}catch(err){toast("…");}return;}
  if(t2.dataset.ovdone){const task=state.tasks.find(x=>x.id===t2.dataset.ovdone);if(task){task.doneDates.push(task.date);persist();renderOverlay();renderAll();haptic("success");}return;}
  if(t2.dataset.ovmove){const task=state.tasks.find(x=>x.id===t2.dataset.ovmove);if(task){task.date=iso(today);persist();renderOverlay();renderAll();}return;}
});

$("#bottomNav").addEventListener("click",e=>{const b=e.target.closest(".nav-btn");if(!b)return;view.tab=b.dataset.tab;renderAll();haptic("light");});

$("#prevBtn").addEventListener("click",()=>shiftPeriod(-1));
$("#nextBtn").addEventListener("click",()=>shiftPeriod(1));
function shiftPeriod(dir){
  if(view.tab==="tasks"){const d=addDays(fromISO(view.selectedDate),dir);view.selectedDate=iso(d);view.calMonth=monthStart(d);}
  else if(view.tab==="habits"){if(view.habitsMode==="week")view.period=addDays(view.period,7*dir);else view.period=monthStart(new Date(view.period.getFullYear(),view.period.getMonth()+dir,1));}
  else if(view.tab==="goals")view.goalsYear+=dir;
  else{
    if(view.anaPeriod==="week")view.anaDate=addDays(view.anaDate,7*dir);
    else if(view.anaPeriod==="month")view.anaDate=monthStart(new Date(view.anaDate.getFullYear(),view.anaDate.getMonth()+dir,1));
    else view.anaDate=new Date(view.anaDate.getFullYear()+dir,0,1);
  }
  renderAll();haptic("light");
}
$("#pillBtn").addEventListener("click",()=>{if(view.tab==="habits"){view.yearOpenHab=!view.yearOpenHab;view.yearPickHab=view.period.getFullYear();renderAll();}});
$("#calBtn").addEventListener("click",()=>{
  if(view.tab==="tasks")view.calOpen=!view.calOpen;
  else if(view.tab==="habits"){view.yearOpenHab=!view.yearOpenHab;view.yearPickHab=view.period.getFullYear();}
  renderAll();
});

$("#calPrev").addEventListener("click",()=>{view.calMonth=monthStart(new Date(view.calMonth.getFullYear(),view.calMonth.getMonth()-1,1));renderTasks();});
$("#calNext").addEventListener("click",()=>{view.calMonth=monthStart(new Date(view.calMonth.getFullYear(),view.calMonth.getMonth()+1,1));renderTasks();});
$("#calGrid").addEventListener("click",e=>{const d=e.target.closest(".cal-day");if(!d)return;view.selectedDate=d.dataset.date;renderTasks();renderTopbar();haptic("light");});

$("#taskSearch").addEventListener("input",e=>{view.taskQuery=e.target.value;renderTasks();});
$("#taskChips").addEventListener("click",e=>{
  const tf=e.target.closest("[data-tf]");if(tf){view.taskFilter=tf.dataset.tf;renderTasks();return;}
  const tg2=e.target.closest("[data-tag]");if(tg2){view.tagFilter=tg2.dataset.tag;renderTasks();}
});
$("#habitSearch").addEventListener("input",e=>{view.habitQuery=e.target.value;renderHabits();});

$("#countersCard").addEventListener("click",e=>{
  const b=e.target.closest("[data-cnt]");if(!b)return;
  const p=b.dataset.cnt.split(":");const key=p[0],dir=p[1];
  const c=COUNTERS.find(x=>x.key===key);if(!c)return;
  if(!state.counters[key])state.counters[key]={};
  const k=iso(today);let v=state.counters[key][k]||0;
  v=Math.max(0,v+(dir==="+"?c.step:-c.step));
  state.counters[key][k]=v;persist();renderTasks();haptic("light");
});

$("#taskList").addEventListener("click",e=>{
  const tsub=e.target.closest("[data-tsub]");
  if(tsub){
    const tid=tsub.dataset.tsub.split(":")[0],sid=tsub.dataset.tsub.split(":")[1];
    const task=state.tasks.find(x=>x.id===tid);if(!task)return;
    const sb=(task.subs||[]).find(x=>x.id===sid);if(!sb)return;
    sb.done=!sb.done;persist();renderTasks();haptic("light");return;
  }
  const del=e.target.closest("[data-del]");
  if(del){state.tasks=state.tasks.filter(x=>x.id!==del.dataset.del);persist();renderTasks();return;}
  const rowEl=e.target.closest(".task-row");
  if(rowEl){
    const task=state.tasks.find(x=>x.id===rowEl.dataset.id);if(!task)return;
    const k=view.selectedDate;
    if(task.doneDates.includes(k))task.doneDates=task.doneDates.filter(x=>x!==k);
    else{task.doneDates.push(k);if(state.settings.tasksConfetti)confetti();haptic("success");}
    persist();renderTasks();
  }
});

$("#randomBtn").addEventListener("click",()=>{
  const s=tasksOn(view.selectedDate);
  const open=s.list.filter(x=>!x.done);
  if(!open.length){toast(t("noTasksDay"));return;}
  const pick=open[Math.floor(Math.random()*open.length)];
  renderTasks();
  const el=document.querySelector('.task-row[data-id="'+pick.task.id+'"]');
  if(el){el.classList.add("flash");el.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>el.classList.remove("flash"),1500);}
  haptic("light");
});
$("#tplBtn").addEventListener("click",()=>openScreen("templates"));
$("#addTaskBtn").addEventListener("click",()=>{taskDraft={date:view.selectedDate,text:"",desc:"",subsText:"",repeat:"once",notify:false,important:false,tag:view.tagFilter||""};openScreen("addTask");});
$("#addHabitBtn").addEventListener("click",()=>{habitDraft={name:"",desc:"",start:iso(today),end:"",repeat:"daily",notify:false};openScreen("addHabit");});

$("#moreBtn").addEventListener("click",()=>{view.moreOpen=!view.moreOpen;$("#morePanel").classList.toggle("hidden",!view.moreOpen);$("#moreBtn").classList.toggle("open",view.moreOpen);haptic("light");});
$("#morePanel").addEventListener("click",e=>{const b=e.target.closest("[data-journal]");if(!b)return;openScreen("journal:"+b.dataset.journal);});

$("#segWeek").addEventListener("click",()=>{view.habitsMode="week";view.period=startOfWeek(view.period);renderAll();});
$("#segMonth").addEventListener("click",()=>{view.habitsMode="month";view.period=monthStart(view.period);renderAll();});
$("#yearPrevHab").addEventListener("click",()=>{view.yearPickHab--;renderHabits();});
$("#yearNextHab").addEventListener("click",()=>{view.yearPickHab++;renderHabits();});
$("#yearGridHab").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;view.period=new Date(view.yearPickHab,parseInt(b.dataset.m,10),1);view.habitsMode="month";view.yearOpenHab=false;renderAll();});
$("#habitsBody").addEventListener("click",e=>{
  const dot=e.target.closest(".dot");
  if(dot){
    if(dot.classList.contains("future"))return;
    const h=state.habits.find(x=>x.id===dot.dataset.hid);if(!h)return;
    const k=dot.dataset.date;
    if(h.logs.includes(k))h.logs=h.logs.filter(l=>l!==k);
    else{h.logs.push(k);if(state.settings.habitsConfetti)confetti();}
    persist();renderHabits();haptic("success");return;
  }
  const mk=e.target.closest(".mark-btn");
  if(mk){
    const h=state.habits.find(x=>x.id===mk.dataset.hid);if(!h)return;
    const k=iso(today);
    if(!h.logs.includes(k)){h.logs.push(k);if(state.settings.habitsConfetti)confetti();haptic("success");}
    persist();renderHabits();
  }
});

$("#anaBody").addEventListener("click",e=>{
  const m=e.target.closest("[data-anamode]");
  if(m){view.anaMode=m.dataset.anamode;renderAll();haptic("light");return;}
  const p=e.target.closest("[data-anaperiod]");
  if(p){view.anaPeriod=p.dataset.anaperiod;renderAll();haptic("light");}
});

$("#goalsBody").addEventListener("click",e=>{
  const gdel=e.target.closest("[data-gdel]");
  if(gdel){state.goals=state.goals.filter(g=>g.id!==gdel.dataset.gdel);persist();renderGoals();return;}
  const plus=e.target.closest("[data-gplus]"),minus=e.target.closest("[data-gminus]"),sub=e.target.closest("[data-sub]");
  if(plus||minus){
    const id=plus?plus.dataset.gplus:minus.dataset.gminus;
    const g=state.goals.find(x=>x.id===id);if(!g)return;
    g.progress=Math.max(0,Math.min(g.target,g.progress+(plus?1:-1)));
    if(g.progress>=g.target&&!g.celebrated){g.celebrated=true;if(state.settings.goalsConfetti)confetti();}
    persist();renderGoals();haptic("success");return;
  }
  if(sub){
    const gid=sub.dataset.sub.split(":")[0],sid=sub.dataset.sub.split(":")[1];
    const g=state.goals.find(x=>x.id===gid);if(!g)return;
    const s=g.subs.find(x=>x.id===sid);if(!s)return;
    s.done=!s.done;persist();renderGoals();haptic("light");
  }
});
$("#addGoalBtn").addEventListener("click",()=>openScreen("addGoal"));

/* ---------- локальные напоминания ---------- */
setInterval(()=>{
  const now=new Date();
  const hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const k=iso(now);
  if(state.settings.morningOn&&hm===state.settings.morningTime&&state.remLast!=="m"+k){state.remLast="m"+k;persist();remind(t("morningRem"));}
  if(state.settings.eveningOn&&hm===state.settings.eveningTime&&state.remLast!=="e"+k){state.remLast="e"+k;persist();remind(t("eveningRem"));}
},15000);
function remind(msg){if(tg&&tg.showPopup){try{tg.showPopup({title:CONFIG.APP_NAME,message:msg});return;}catch(e){}}toast(msg);}

/* Инициализация */
document.querySelectorAll(".foot").forEach(f=>f.textContent=CONFIG.FOOTER);
if(tg){try{tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor("#17212b");if(tg.setBackgroundColor)tg.setBackgroundColor("#17212b");}catch(e){}}
if(tgUser&&tgUser.first_name)$("#avatarBtn").textContent=tgUser.first_name.charAt(0).toUpperCase();
loadState();
applyTheme();
applyI18n();
renderAll();
</script>
