<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:#17212b;--card:#1e2a36;--card2:#24313f;--line:#2c3a49;--navbg:#101820;--text:#eef4fa;--muted:#7f8e9c;--accent:#64a9dd;--ok:#6fce8a;--warn:#f2c94c;--danger:#e06c6c;color-scheme:dark}
  html[data-theme="light"]{--bg:#eef3f7;--card:#fff;--card2:#e9eef4;--line:#d5dfe8;--navbg:#fff;--text:#17212b;--muted:#5c6b7a;--accent:#3f8ec7;color-scheme:light}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font:inherit}
  .hidden{display:none!important}
  .icn{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
  .round .icn{width:16px;height:16px;stroke-width:2.4}
  .nav-btn .icn{width:20px;height:20px;stroke-width:2}
  .segment .icn{width:20px;height:20px;stroke-width:2}
  .li .icn{width:16px;height:16px;stroke-width:2}
  .arr .icn{width:16px;height:16px;stroke-width:2.2}
  .wide-btn .icn{width:20px;height:20px;stroke-width:2}
  .more-btn .icn{width:18px;height:18px;stroke-width:2.2;transition:transform .2s}
  .more-btn.open .icn{transform:rotate(180deg)}
  .empty .icn{width:76px;height:76px;stroke-width:1.2;display:block;margin:0 auto 12px}
  .chk{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:transparent}
  .chk.on{background:var(--accent);border-color:var(--accent);color:#0d1720}
  .sub .chk .icn,.chk .icn{width:12px;height:12px;stroke-width:3.2}
  .mini-del{color:var(--muted);padding:4px;display:flex}
  .mini-del .icn{width:16px;height:16px;stroke-width:1.7}
  .pencil{color:var(--accent);display:flex;padding:2px}
  .pencil .icn{width:16px;height:16px;stroke-width:1.8}
  .t-ic{display:inline-flex;margin-right:4px;vertical-align:-2px}
  .t-ic .icn{width:13px;height:13px;stroke-width:2.2}
  .t-ic.imp{color:var(--warn)}.t-ic.ntf{color:var(--accent)}.t-ic.rpt{color:var(--muted)}.t-ic.rem{color:var(--danger)}
  .star .icn{width:18px;height:18px;color:var(--warn);stroke-width:1.6}
  .li{color:#fff}
  .tagdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
  .app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
  .h-actions{display:flex;gap:6px}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}
  .icon-btn:active{background:var(--card2)}
  .topbar{display:flex;align-items:center;gap:8px;padding:4px 14px 12px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;overflow:hidden;cursor:pointer;color:var(--text)}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  .round{background:var(--card2);width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
  .round.calOn{background:var(--accent);color:#0d1720}
  .pill{flex:1;max-width:190px;margin:0 auto;background:var(--card2);border-radius:14px;padding:7px 10px;text-align:center;line-height:1.25}
  .pill .t{display:block;color:var(--accent);font-size:13px;font-weight:600}
  .pill .b{display:block;color:var(--muted);font-size:11px}
  .pill.calOn{background:var(--accent)}
  .pill.calOn .t,.pill.calOn .b{color:#0d1720}
  main{padding:0 14px 96px}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
  .search-card{padding:10px 12px}
  .search-card input{width:100%;background:var(--card2);border:none;outline:none;border-radius:12px;padding:11px 12px;color:var(--text);font-size:14px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--card2);color:var(--muted);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .chip.active{background:var(--accent);color:#0d1720}
  .chip .icn{width:13px;height:13px;stroke-width:2.2}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-head .m{font-size:17px;font-weight:700}
  .cal-nav{display:flex;gap:4px}
  .cal-nav button{color:var(--accent);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .cal-nav .icn{width:16px;height:16px;stroke-width:2.4}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-wd{color:var(--muted);font-size:11px;text-align:center;padding:6px 0}
  .cal-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px}
  .cal-day .n{font-size:15px;font-weight:600;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .cal-day .c{font-size:10px;color:var(--muted)}
  .cal-day.past{opacity:.45}
  .cal-day.today .n{background:var(--card2);color:var(--accent)}
  .cal-day.sel .n{background:var(--accent);color:#0d1720}
  .cal-day:active{background:var(--card2)}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;border-radius:12px;padding:3px 0;margin:1px 0}
  .cal-week.sel{background:var(--card2)}
  .cal-day2{padding:9px 0;text-align:center;font-size:15px;font-weight:600;border-radius:10px;color:var(--text)}
  .cal-day2.dim{opacity:.32}
  .cal-day2.today{color:var(--accent)}
  .months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .months-grid.cols4{grid-template-columns:repeat(4,1fr)}
  .months-grid button{background:var(--card2);border-radius:12px;padding:12px 0;color:var(--muted);font-weight:600;font-size:14px}
  .months-grid button.cur{background:#2b4a66;color:var(--accent)}
  .summary{display:flex;justify-content:flex-end;align-items:center;padding:14px 18px}
  .summary .v{font-size:22px;font-weight:800}
  .cnt-row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .cnt-row .ci{font-size:17px;width:24px;text-align:center}
  .cnt-row .cn{width:64px;font-size:13px;color:var(--muted)}
  .cnt-row .bar{flex:1;height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
  .cnt-row .bar i{display:block;height:100%;background:var(--accent)}
  .cnt-row .cv{width:82px;text-align:right;font-size:12.5px;font-weight:700;cursor:pointer}
  .cnt-row .cv .ed{opacity:.5;font-size:10px}
  .cnt-btn{width:30px;height:30px;border-radius:10px;background:var(--card2);font-weight:800;font-size:15px;flex:none}
  .task-row{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:14px;padding:12px;margin-bottom:8px}
  .task-wrap .subs{background:var(--card2);border-radius:0 0 14px 14px;margin:-4px 0 8px;padding:4px 12px 10px}
  .task-wrap .task-row{margin-bottom:0}
  .task-wrap.has-subs .task-row{border-radius:14px 14px 0 0}
  .task-row.done .chk{background:var(--accent);border-color:var(--accent);color:#0d1720}
  .task-row.done .t{opacity:.55;text-decoration:line-through}
  .task-row .t{flex:1;word-break:break-word;font-size:15px}
  .task-row .t .desc{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
  .task-row.flash{animation:flashRow 1.4s}
  @keyframes flashRow{0%{background:var(--accent);color:#0d1720}70%{background:var(--accent)}100%{}}
  .empty{text-align:center;color:var(--muted);padding:22px 0;font-size:14px}
  .wide-btn{width:100%;background:var(--card);border-radius:16px;padding:15px;font-weight:600;font-size:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:9px}
  .wide-btn:active{background:var(--card2)}
  .btn-row{display:flex;gap:10px}
  .btn-row .wide-btn{flex:1}
  .more-btn{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;font-size:15px}
  .segment{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
  .segment button{flex:1;padding:10px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
  .segment button.active{background:var(--card2);color:var(--accent)}
  .h-row{background:var(--card2);border-radius:14px;padding:12px;margin-bottom:8px}
  .h-name{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .h-name .hn{flex:1;word-break:break-word}
  .h-name .cnt{color:var(--muted);font-weight:500;font-size:12px;flex:none}
  .h-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dot{height:34px;border-radius:10px;background:var(--card);color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .dot.on{background:var(--accent);color:#0d1720}
  .dot.future{opacity:.3}
  .h-month{display:flex;align-items:center;gap:10px}
  .h-month .bar{flex:1;height:8px;border-radius:4px;background:var(--card);overflow:hidden}
  .h-month .bar i{display:block;height:100%;background:var(--accent)}
  .mark-btn{background:var(--accent);color:#0d1720;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;flex:none}
  .mark-btn.off{background:var(--card);color:var(--muted)}
  .goal{background:var(--card2);border-radius:14px;padding:14px;margin-bottom:10px}
  .g-head{display:flex;align-items:flex-start;gap:8px}
  .g-head .tt{flex:1;font-weight:700;font-size:15px}
  .g-desc{color:var(--muted);font-size:13px;margin:6px 0 0 28px}
  .g-prog{display:flex;align-items:center;gap:10px;margin:12px 0 8px}
  .g-prog .bar{flex:1;height:8px;border-radius:4px;background:var(--card);overflow:hidden}
  .g-prog .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .g-prog .num{font-weight:700;font-size:13px;color:var(--accent);flex:none}
  .g-ctrl{display:flex;gap:8px}
  .g-ctrl button{background:var(--card);border-radius:10px;width:40px;height:34px;font-size:17px;font-weight:700}
  .g-ctrl .done-tag{flex:1;text-align:center;color:var(--ok);font-weight:700;align-self:center}
  .subs{margin-top:10px}
  .sub{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
  .sub .chk{width:20px;height:20px;border-width:2px}
  .sub.done .chk{background:var(--accent);border-color:var(--accent);color:#0d1720}
  .sub.done .t{opacity:.55;text-decoration:line-through}
  .a-title{font-size:14px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .a-title .icn{width:16px;height:16px;stroke-width:2}
  .a-big{font-size:24px;font-weight:800;margin-bottom:10px}
  .a-bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
  .a-bar i{display:block;height:100%;background:var(--accent)}
  .delta{font-size:12.5px;font-weight:700;margin-left:6px}
  .delta.up{color:var(--ok)}.delta.down{color:var(--danger)}.delta.flat{color:var(--muted)}
  .bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
  .bars .c{font-size:9.5px;color:var(--muted);white-space:nowrap}
  .bars .b{width:100%;border-radius:6px;background:var(--accent);min-height:4px}
  .bars .l{font-size:10px;color:var(--muted);white-space:nowrap}
  .bars .col.hot .l{color:var(--accent);font-weight:700}
  .hm{display:grid;grid-template-rows:repeat(7,9px);grid-auto-flow:column;gap:3px;overflow-x:auto;padding-bottom:4px}
  .hm i{width:9px;height:9px;border-radius:2.5px;background:var(--card2)}
  .ana-stats{display:flex;align-items:center;gap:16px}
  .ring-wrap{position:relative;width:104px;height:104px;flex:none}
  .ring-wrap svg{width:104px;height:104px;transform:rotate(-90deg)}
  .ring-wrap .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
  .st-rows{flex:1}
  .st-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3.5px 0}
  .st-row .v{font-weight:700}
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px}
  .nav-btn .nb-ic{width:34px;height:30px;border-radius:9px;background:#b6bdc6;display:flex;align-items:center;justify-content:center;color:#17212b}
  html[data-theme="light"] .nav-btn .nb-ic{background:#dfe6ec}
  .nav-btn.active{color:var(--accent)}
  .nav-btn.active .nb-ic{background:var(--accent);color:#101820}
  .foot{text-align:center;color:var(--muted);font-size:13px;padding:6px 0 2px}
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
  .ov-header{display:flex;align-items:center;gap:8px;padding:14px 12px 10px}
  .ov-header .t{flex:1;font-size:18px;font-weight:700;text-align:center;margin-right:76px}
  .ov-body{flex:1;overflow-y:auto;padding:4px 14px 30px}
  .ov-title-big{text-align:center;font-size:18px;font-weight:700;margin:14px 0 18px}
  .sec-title{color:var(--accent);font-size:14px;font-weight:600;margin:16px 2px 8px}
  .list-card{background:var(--card);border-radius:16px;overflow:hidden}
  .list-card.solo{margin-bottom:12px}
  .list-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;font-size:15px}
  .list-row + .list-row{border-top:1px solid var(--line)}
  .list-row .li{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
  .list-row .lt{flex:1}
  .list-row .lt.done{opacity:.55;text-decoration:line-through}
  .list-row .val{color:var(--muted);font-size:13.5px;text-align:right}
  .list-row .arr{color:var(--muted);display:flex}
  .clr{color:var(--muted);display:flex;padding:2px}
  .clr .icn{width:14px;height:14px;stroke-width:2.2}
  .val-pill{background:var(--card2);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;flex:none;display:flex;align-items:center}
  .switch{position:relative;width:46px;height:27px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
  .switch .sl{position:absolute;inset:0;border-radius:14px;background:#3a4753;transition:.2s}
  .switch .sl::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked + .sl{background:var(--accent)}
  .switch input:checked + .sl::after{transform:translateX(19px)}
  .time-row{display:flex;align-items:center;gap:10px;padding:0 14px 14px}
  .time-row input{flex:1;background:var(--card2);border:none;outline:none;border-radius:12px;padding:14px;text-align:center;font-size:18px;font-weight:600;color:var(--text)}
  .time-row .colon{color:var(--muted);font-size:18px;font-weight:700}
  .notif-card.dimmed .time-row{opacity:.45;pointer-events:none}
  .form-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
  .form-card textarea,.form-card input[type=text],.form-card input[type=number]{width:100%;background:var(--card2);border:none;outline:none;border-radius:12px;padding:12px;color:var(--text);font-size:15px;resize:vertical}
  .form-card label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  .save-btn{width:100%;margin-top:6px;background:var(--accent);color:#0d1720;border-radius:14px;padding:14px;font-weight:700;font-size:15px}
  .note{color:var(--accent);font-size:12.5px;line-height:1.5;display:flex;gap:8px;margin:4px 2px;align-items:flex-start}
  .note .icn{width:15px;height:15px;margin-top:1px}
  input[type=date].hidden-date,input[type=time].hidden-date{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .code{background:var(--card2);border-radius:12px;padding:12px;font-size:10.5px;line-height:1.5;overflow:auto;max-height:320px;white-space:pre;color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace}
  .doc{color:var(--muted);font-size:14px;line-height:1.55}
  .doc p{margin-bottom:10px}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .swatches button{width:34px;height:34px;border-radius:10px}
  .swatches button.sel{outline:3px solid var(--text)}
  .emo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .emo-grid button{font-size:26px;background:var(--card2);border-radius:12px;padding:10px 0}
  .emo-grid button.sel{outline:3px solid var(--accent)}
  #confirmOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
  #confirmOverlay .card{width:100%;max-width:340px;margin:0}
  #confirmMsg{text-align:center;font-weight:600;margin-bottom:14px}
  #undoToast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--card2);border-radius:12px;padding:10px 16px;display:flex;gap:14px;align-items:center;z-index:160;opacity:0;pointer-events:none;transition:.25s;font-size:14px}
  #undoToast.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
  #undoBtn{color:var(--accent);font-weight:700}
  #onb{z-index:200}
  .onb-head{display:flex;justify-content:flex-end;padding:14px 14px 0}
  .onb-skip{color:var(--muted);font-size:13px;font-weight:600;padding:8px 6px}
  .onb-ic{width:140px;height:140px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;margin:22px auto 20px}
  .onb-ic .icn{width:70px;height:70px;stroke-width:1.4}
  .onb-title{text-align:center;font-size:18px;font-weight:600;letter-spacing:.3px;margin-bottom:10px;padding:0 24px}
  .onb-text{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;padding:0 30px;font-weight:400}
  .onb-foot{padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--card2)}
  .dots i.on{background:var(--accent)}
  #confettiRoot{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
  #confettiRoot i{position:absolute;top:-14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
  @keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
  #toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--card2);color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:120;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="app-header">
  <div class="avatar" id="avatarBtn">🙂</div>
  <div class="h-actions">
    <button class="icon-btn" id="btnMenu"><svg class="icn"><use href="#i-gear"/></svg></button>
  </div>
</header>

<div class="topbar">
  <button class="icon-btn round" id="btnSearch"><svg class="icn"><use href="#i-search"/></svg></button>
  <button class="icon-btn round" id="prevBtn"><svg class="icn"><use href="#i-chev-l"/></svg></button>
  <button class="pill" id="pillBtn"><span class="t" id="pillTop">Сегодня</span><span class="b" id="pillBottom"></span></button>
  <button class="icon-btn round" id="nextBtn"><svg class="icn"><use href="#i-chev-r"/></svg></button>
  <button class="icon-btn round" id="calBtn"><svg class="icn"><use href="#i-cal"/></svg></button>
</div>

<main>
  <div class="card search-card hidden" id="searchCard"><input id="searchInput" type="text" data-tph="searchPh" placeholder="Поиск..."></div>

  <section id="tabTasks" class="tab">
    <div class="card hidden" id="calCard">
      <div class="cal-head"><div class="m" id="calTitle"></div>
        <div class="cal-nav"><button id="calPrev"><svg class="icn"><use href="#i-chev-l"/></svg></button><button id="calNext"><svg class="icn"><use href="#i-chev-r"/></svg></button></div>
      </div>
      <div class="cal-grid" id="calWd"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="card search-card"><div class="chips" id="taskChips"></div></div>
    <div class="card summary"><div class="v" id="daySummary">0 / 0</div></div>
    <div class="card" id="countersCard"></div>
    <div class="card" id="taskListCard"><div id="taskList"></div></div>
    <button class="wide-btn" id="addTaskBtn"><svg class="icn"><use href="#i-plus"/></svg><span data-t="addTask">Добавить задачу</span></button>
    <button class="wide-btn" id="plannerBtn"><svg class="icn"><use href="#i-cal"/></svg><span data-t="planner">Планер на 7 дней</span></button>
    <div class="btn-row">
      <button class="wide-btn" id="randomBtn"><svg class="icn"><use href="#i-dice"/></svg><span data-t="random">Случайная задача</span></button>
      <button class="wide-btn" id="tplBtn"><svg class="icn"><use href="#i-tpl"/></svg><span data-t="templates">Шаблоны</span></button>
    </div>
    <button class="more-btn" id="moreBtn"><svg class="icn"><use href="#i-chev-d"/></svg><span data-t="more">Ещё</span></button>
    <div id="morePanel" class="hidden">
      <button class="wide-btn" data-journal="notes"><svg class="icn"><use href="#i-clip"/></svg><span data-t="notes">Заметки</span></button>
      <button class="wide-btn" data-journal="lesson"><svg class="icn"><use href="#i-grad"/></svg><span data-t="lesson">Урок дня</span></button>
      <button class="wide-btn" data-journal="gratitude"><svg class="icn"><use href="#i-heart"/></svg><span data-t="gratitude">Благодарность</span></button>
      <button class="wide-btn" data-journal="thoughts"><svg class="icn"><use href="#i-bulb"/></svg><span data-t="thoughts">Мысли</span></button>
    </div>
    <input type="date" class="hidden-date" id="moveDateInput">
  </section>

  <section id="tabHabits" class="tab hidden">
    <div class="card hidden" id="habCalCard"></div>
    <div class="segment">
      <button id="segWeek"><svg class="icn"><use href="#i-week"/></svg><span data-t="week">Неделя</span></button>
      <button id="segMonth"><svg class="icn"><use href="#i-month"/></svg><span data-t="month">Месяц</span></button>
    </div>
    <div class="card" id="habitsBody"></div>
    <button class="wide-btn" id="addHabitBtn"><svg class="icn"><use href="#i-plus"/></svg><span data-t="addHabit">Добавить привычку</span></button>
  </section>

  <section id="tabGoals" class="tab hidden">
    <div class="card hidden" id="goalCalCard"></div>
    <div class="card" id="goalsBody"></div>
    <button class="wide-btn" id="addGoalBtn"><svg class="icn"><use href="#i-plus"/></svg><span data-t="addGoal">Добавить цель</span></button>
  </section>

  <section id="tabAnalytics" class="tab hidden"><div id="anaBody"></div></section>

  <div class="foot" id="mainFooter">@uTasklyBot</div>
</main>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-btn active" data-tab="tasks"><span class="nb-ic"><svg class="icn"><use href="#i-nav-tasks"/></svg></span><span data-t="tasks">Задачи</span></button>
  <button class="nav-btn" data-tab="habits" id="navHabits"><span class="nb-ic"><svg class="icn"><use href="#i-nav-habits"/></svg></span><span data-t="habits">Привычки</span></button>
  <button class="nav-btn" data-tab="goals" id="navGoals"><span class="nb-ic"><svg class="icn"><use href="#i-nav-goals"/></svg></span><span data-t="goals">Цели на год</span></button>
  <button class="nav-btn" data-tab="analytics" id="navAnalytics"><span class="nb-ic"><svg class="icn"><use href="#i-nav-analytics"/></svg></span><span data-t="analytics">Аналитика</span></button>
</nav>

<div class="overlay hidden" id="overlay">
  <div class="ov-header">
    <button class="icon-btn" id="ovBack"><svg class="icn"><use href="#i-back"/></svg></button>
    <div class="t" id="ovTitle"></div>
    <button class="icon-btn" id="ovClose"><svg class="icn"><use href="#i-close"/></svg></button>
  </div>
  <div class="ov-body" id="ovBody"></div>
  <div class="foot" id="ovFooter">@uTasklyBot</div>
</div>

<div id="confirmOverlay" class="hidden">
  <div class="card">
    <div id="confirmMsg"></div>
    <div class="btn-row">
      <button class="wide-btn" id="confirmNo" style="margin:0"></button>
      <button class="wide-btn" id="confirmYes" style="margin:0;background:var(--danger);color:#fff"></button>
    </div>
  </div>
</div>
<div id="undoToast"><span id="undoText"></span><button id="undoBtn"></button></div>

<div class="overlay hidden" id="onb">
  <div class="onb-head"><button class="onb-skip" id="onbSkip"></button></div>
  <div style="flex:1">
    <div class="onb-ic" id="onbIc"></div>
    <div class="onb-title" id="onbTitle"></div>
    <div class="onb-text" id="onbText"></div>
  </div>
  <div class="onb-foot">
    <div class="dots" id="onbDots"></div>
    <button class="save-btn" id="onbNext" style="margin:0"></button>
  </div>
</div>

<div id="confettiRoot"></div>
<div id="toast"></div>

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function startOfWeek(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(x){var d=document.createElement("div");d.textContent=x;return d.innerHTML;}
function loc(f){return new Intl.DateTimeFormat(lang()==="en"?"en-US":"ru-RU",f);}
function fmtDayLong(key){return cap(loc({day:"numeric",month:"short",year:"numeric"}).format(fromISO(key)))+".";}
function fmtShort(d){return loc({day:"numeric",month:"short"}).format(d);}
function fmtWd(d){return loc({weekday:"short",day:"numeric",month:"short"}).format(d);}
function isoWeek(dt){var d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));var day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);var ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);}
function sameWeek(a,b){return +startOfWeek(fromISO(a))===+startOfWeek(fromISO(b));}
function monthWeeks(y,m){var first=new Date(y,m,1),last=new Date(y,m+1,0);var wS=startOfWeek(first),w=[];while(wS<=startOfWeek(last)){var wk=[];for(var i=0;i<7;i++)wk.push(addDays(wS,i));w.push(wk);wS=addDays(wS,7);}return w;}

function occursOn(tk,key){
  if(key<tk.date)return false;
  if(tk.repeat==="daily")return true;
  if(tk.repeat==="weekly")return fromISO(key).getDay()===fromISO(tk.date).getDay();
  if(tk.repeat==="monthly")return fromISO(key).getDate()===fromISO(tk.date).getDate();
  return key===tk.date;
}

  if(view.taskSort==="done")return list.sort(function(a,b){return (a.done?1:0)-(b.done?1:0);});
  return list.sort(function(a,b){return ((b.task.important?1:0)-(a.task.important?1:0))||((a.done?1:0)-(b.done?1:0));});
}

}

function weekCalHTML(disp,selWeek,tag){

  html+='<div class="cal-grid">'+wd().map(function(w){return '<span class="cal-wd">'+w+"</span>";}).join("")+"</div>";

function bucketsFor(anchor,period){
  var b=[];
  if(period==="week"){var mon=startOfWeek(anchor);for(var i=0;i<7;i++)b.push({label:wd()[i],days:[addDays(mon,i)]});}
  else if(period==="month"){var y=anchor.getFullYear(),m=anchor.getMonth(),dim=new Date(y,m+1,0).getDate();
    for(var w=0;w<Math.ceil(dim/7);w++){var days=[];for(var dd=w*7+1;dd<=Math.min(dim,(w+1)*7);dd++)days.push(new Date(y,m,dd));b.push({label:(w*7+1)+"–"+Math.min(dim,(w+1)*7),days:days});}}
  else{var y2=anchor.getFullYear();for(var m2=0;m2<12;m2++){var dim2=new Date(y2,m2+1,0).getDate();var days2=[];for(var d2=1;d2<=dim2;d2++)days2.push(new Date(y2,m2,d2));b.push({label:mG()[m2],days:days2});}}
  return b;
}
function agg(buckets){
  var total=0,done=0,marks=0,expected=0;
  var per=buckets.map(function(bk){var bT=0,bD=0,bM=0;
    bk.days.forEach(function(d){var k=iso(d);var s=tasksOn(k);bT+=s.total;bD+=s.done;bM+=marksOn(k);if(d<=today)expected+=state.habits.filter(function(h){return habitActiveOn(h,k);}).length;});
    total+=bT;done+=bD;marks+=bM;return {label:bk.label,t:bT,d:bD,m:bM};});
  return {per:per,total:total,done:done,marks:marks,expected:expected};
}

function pad2(v,max){var n=parseInt(v||"0",10);if(isNaN(n))n=0;return String(Math.max(0,Math.min(max,n))).padStart(2,"0");}

function renderOverlay(){
  var cur=ovStack[ovStack.length-1],name=cur,param=null;
  if(cur.indexOf("journal:")===0){name="journal";param=cur.split(":")[1];}
  else if(cur.indexOf("edit:")===0){name="edit";param=cur.split(":")[1];}
  else if(cur.indexOf("editTag:")===0){name="editTag";param=cur.split(":")[1];}
  else if(cur.indexOf("editCounter:")===0){name="editCounter";param=cur.split(":")[1];}
  var s=(name==="journal")?SCREENS.journal(param):(name==="edit")?SCREENS.edit(param):(name==="editTag")?SCREENS.editTag(param):(name==="editCounter")?SCREENS.editCounter(param):SCREENS[name]();
  $("#ovTitle").textContent=s.title;
  $("#ovBody").innerHTML=s.html;

  if(name==="edit"){
    $("#editInput").addEventListener("input",function(e){editDraft.value=e.target.value;});
    $("#editSave").addEventListener("click",function(){state.profile[editDraft.field]=editDraft.value.trim();persist();backScreen();renderAll();toast("OK");});
  }
  if(name==="editCounter"){
    $("#cgSave").addEventListener("click",function(){
      var v=Math.max(1,parseInt($("#cgInput").value,10)||1);
      if(!state.counterGoals)state.counterGoals={};

function shiftPeriod(dir){
  if(view.tab==="tasks"){var d=addDays(fromISO(view.selectedDate),dir);view.selectedDate=iso(d);view.calMonth=monthStart(d);}
  else if(view.tab==="habits"){if(view.habitsMode==="week"){view.period=addDays(view.period,7*dir);}else{view.period=monthStart(new Date(view.period.getFullYear(),view.period.getMonth()+dir,1));}view.habCalMonth=monthStart(view.period);}
  else if(view.tab==="goals")view.goalsYear+=dir;
  else{if(view.anaPeriod==="week"){view.anaDate=addDays(view.anaDate,7*dir);view.anaCalMonth=monthStart(view.anaDate);}else if(view.anaPeriod==="month"){view.anaDate=monthStart(new Date(view.anaDate.getFullYear(),view.anaDate.getMonth()+dir,1));view.anaCalMonth=monthStart(view.anaDate);}else view.anaDate=new Date(view.anaDate.getFullYear()+dir,0,1);}
  renderAll();haptic("light");
}

$("#habitsBody").addEventListener("click",function(e){
  var he=e.target.closest("[data-hedit]");
  if(he){var hb=state.habits.find(function(x){return x.id===he.getAttribute("data-hedit");});if(!hb)return;
    habitDraft={editingId:hb.id,name:hb.name,desc:hb.desc||"",start:hb.start||iso(today),end:hb.end||"",repeat:hb.repeat||"daily",notify:hb.notify||false,remind:hb.remind||""};
    openScreen("addHabit");return;}
  var dot=e.target.closest(".dot");
  if(dot){if(dot.classList.contains("future"))return;
    var h=state.habits.find(function(x){return x.id===dot.getAttribute("data-hid");});if(!h)return;
    var k=dot.getAttribute("data-date");
    if(h.logs.indexOf(k)>=0)h.logs=h.logs.filter(function(l){return l!==k;});
    else{h.logs.push(k);if(state.settings.habitsConfetti)confetti();}
    persist();renderHabits();haptic("success");return;}
  var mk=e.target.closest(".mark-btn");
  if(mk){var h2=state.habits.find(function(x){return x.id===mk.getAttribute("data-hid");});if(!h2)return;
    var k2=iso(today);
    if(h2.logs.indexOf(k2)<0){h2.logs.push(k2);if(state.settings.habitsConfetti)confetti();haptic("success");}
    persist();renderHabits();}
});
$("#anaBody").addEventListener("click",function(e){
  if(e.target.closest("[data-acwmprev]")){view.anaCalMonth=monthStart(new Date(view.anaCalMonth.getFullYear(),view.anaCalMonth.getMonth()-1,1));renderAnalytics();return;}
  if(e.target.closest("[data-acwmnext]")){view.anaCalMonth=monthStart(new Date(view.anaCalMonth.getFullYear(),view.anaCalMonth.getMonth()+1,1));renderAnalytics();return;}
  if(e.target.closest("[data-acmyprev]")){view.anaCalMonth=new Date(view.anaCalMonth.getFullYear()-1,view.anaCalMonth.getMonth(),1);renderAnalytics();return;}
  if(e.target.closest("[data-acmynext]")){view.anaCalMonth=new Date(view.anaCalMonth.getFullYear()+1,view.anaCalMonth.getMonth(),1);renderAnalytics();return;}
  if(e.target.closest("[data-acypprev]")){view.anaYearPage-=12;renderAnalytics();return;}
  if(e.target.closest("[data-acypnext]")){view.anaYearPage+=12;renderAnalytics();return;}
  var adb=e.target.closest("[data-acwday]");if(adb){var d=fromISO(adb.getAttribute("data-acwday"));view.anaDate=d;view.anaCalMonth=monthStart(d);renderAll();return;}
  var amb=e.target.closest("[data-acmm]");if(amb){view.anaDate=new Date(view.anaCalMonth.getFullYear(),parseInt(amb.getAttribute("data-acmm"),10),1);view.calOpen.analytics=false;renderAll();return;}
  var ayb=e.target.closest("[data-acyy]");if(ayb){view.anaDate=new Date(parseInt(ayb.getAttribute("data-acyy"),10),0,1);view.calOpen.analytics=false;renderAll();return;}
  var m=e.target.closest("[data-anamode]");if(m){view.anaMode=m.getAttribute("data-anamode");renderAll();haptic("light");return;}
  var p=e.target.closest("[data-anaperiod]");if(p){view.anaPeriod=p.getAttribute("data-anaperiod");renderAll();haptic("light");}
});
$("#goalsBody").addEventListener("click",function(e){
  var ge=e.target.closest("[data-gedit]");
  if(ge){var g0=state.goals.find(function(x){return x.id===ge.getAttribute("data-gedit");});if(!g0)return;
    goalDraft={editingId:g0.id,title:g0.title,desc:g0.desc||"",smart:g0.smart||"",target:g0.target,subs:g0.subs||[]};
    openScreen("addGoal");return;}
  var garch=e.target.closest("[data-garch]");
  if(garch){
    var id=garch.getAttribute("data-garch");
    var g=state.goals.find(function(x){return x.id===id;});if(!g)return;
    var idx=state.goals.indexOf(g);
    state.goals.splice(idx,1);
    state.archive.goals.push(g);
    persist();renderGoals();toast("🗂 "+t("archive"));
    showUndo(function(){state.archive.goals=state.archive.goals.filter(function(x){return x.id!==id;});state.goals.push(g);});
    return;
  }
  var gdel=e.target.closest("[data-gdel]");
  if(gdel){var id2=gdel.getAttribute("data-gdel");var g1=state.goals.find(function(x){return x.id===id2;});var idx2=state.goals.indexOf(g1);
    safeDel(function(){state.goals.splice(idx2,1);},function(){state.goals.splice(Math.min(idx2,state.goals.length),0,g1);});
    return;}
  var plus=e.target.closest("[data-gplus]"),minus=e.target.closest("[data-gminus]"),sub=e.target.closest("[data-sub]");
  if(plus||minus){var id3=plus?plus.getAttribute("data-gplus"):minus.getAttribute("data-gminus");
    var g=state.goals.find(function(x){return x.id===id3;});if(!g)return;
    g.progress=Math.max(0,Math.min(g.target,g.progress+(plus?1:-1)));
    if(g.progress>=g.target&&!g.celebrated){g.celebrated=true;if(state.settings.goalsConfetti)confetti();}
    persist();renderGoals();haptic("success");return;}
  if(sub){var parts=sub.getAttribute("data-sub").split(":");var g2=state.goals.find(function(x){return x.id===parts[0];});if(!g2)return;
    var s=g2.subs.find(function(x){return x.id===parts[1];});if(!s)return;s.done=!s.done;persist();renderGoals();haptic("light");}
});
$("#addGoalBtn").addEventListener("click",function(){goalDraft=null;openScreen("addGoal");});

setInterval(function(){
  var now=new Date();
  var hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  var k=iso(now);
  if(state.settings.morningOn&&hm===state.settings.morningTime&&state.remLast!=="m"+k){state.remLast="m"+k;persist();remind(t("morningRem"));}
  if(state.settings.eveningOn&&hm===state.settings.eveningTime&&state.remLast!=="e"+k){state.remLast="e"+k;persist();remind(t("eveningRem"));}
  state.tasks.forEach(function(tk){
    if(tk.remind&&occursOn(tk,k)&&hm===tk.remind&&tk.remLast!==k+tk.remind){tk.remLast=k+tk.remind;persist();remind("⏰ "+tk.text);}
  });
},15000);
function remind(msg){if(tg&&tg.showPopup){try{tg.showPopup({title:CONFIG.APP_NAME,message:msg});return;}catch(e){}}toast(msg);}

var onbIndex=0;
var ONB=[
  {icon:"i-duck",t:"onb1t",x:"onb1x"},
  {icon:"i-nav-tasks",t:"onb2t",x:"onb2x"},
  {icon:"i-fire",t:"onb3t",x:"onb3x"},
  {icon:"i-nav-analytics",t:"onb4t",x:"onb4x"}
];
function showOnb(){onbIndex=0;renderOnb();$("#onb").classList.remove("hidden");}
function renderOnb(){
  var s=ONB[onbIndex];
  $("#onbIc").innerHTML=ic(s.icon);
  $("#onbTitle").textContent=t(s.t);
  $("#onbText").textContent=t(s.x);
  $("#onbDots").innerHTML=ONB.map(function(z,i){return '<i class="'+(i===onbIndex?"on":"")+'"></i>';}).join("");
  $("#onbNext").textContent=onbIndex<ONB.length-1?t("next"):t("start");
  $("#onbSkip").textContent=t("skip");
}
function finishOnb(){state.onboarded=true;persist();$("#onb").classList.add("hidden");renderAll();}
$("#onbNext").addEventListener("click",function(){if(onbIndex<ONB.length-1){onbIndex++;renderOnb();haptic("light");}else{finishOnb();if(state.settings.tasksConfetti)confetti();}});
$("#onbSkip").addEventListener("click",finishOnb);
var touchX=null;
$("#onb").addEventListener("touchstart",function(e){touchX=e.touches[0].clientX;});
$("#onb").addEventListener("touchend",function(e){
  if(touchX===null)return;
  var dx=e.changedTouches[0].clientX-touchX;touchX=null;
  if(dx<-40&&onbIndex<ONB.length-1){onbIndex++;renderOnb();}
  else if(dx>40&&onbIndex>0){onbIndex--;renderOnb();}
});

document.querySelectorAll(".foot").forEach(function(f){f.textContent=CONFIG.FOOTER;});
if(tg){try{tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor("#17212b");if(tg.setBackgroundColor)tg.setBackgroundColor("#17212b");}catch(e){}}
loadState();
applyTheme();
applyI18n();
renderAll();
loadAvatar();
if(!state.onboarded)showOnb();
</script>

<script>
/* =====================================================
   СИНХРОНИЗАЦИЯ v3 — данные привязаны к Telegram-аккаунту
   + напоминания привычек попадают в сводки воркера
   (WORKER_URL уже определён в основном скрипте)
   ===================================================== */
(function () {
  var pushTimer = null;
  function queuePush() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      if (!tg || !tg.initData) return;
      fetch(WORKER_URL + "/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: tg.initData, state: state })
      }).catch(function () {});
    }, 1500);
  }
  var _origPersist = persist;
  persist = function () { _origPersist(); queuePush(); };

  function pull() {
    if (!tg || !tg.initData) return;
    fetch(WORKER_URL + "/load", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg.initData })
    })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.ok && j.state && (j.state.updatedAt || 0) > (state.updatedAt || 0)) {
        var remote = j.state;
        if (remote.settings) remote.settings = Object.assign({}, state.settings, remote.settings);
        state = remote;
        initProfile();
        _origPersist();
        applyI18n(); applyTheme(); renderAll();
        toast("☁️ Данные загружены из аккаунта");
      }
    })
    .catch(function () {});
  }
  var tries = 0;
  var wait = setInterval(function () {
    tries++;
    if (tg && tg.initData) { clearInterval(wait); pull(); }
    else if (tries > 10) clearInterval(wait);
  }, 500);

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function calcStats() {
    var k = todayKey();
    var tasksToday = state.tasks.filter(function (t) { return occursOn(t, k); });
    var tasksDone  = tasksToday.filter(function (t) { return (t.doneDates || []).indexOf(k) >= 0; });
    var habitsToday = state.habits.filter(function (h) { return !h.start || h.start <= k; });
    var habitsDone  = habitsToday.filter(function (h) { return h.logs.indexOf(k) >= 0; });
    var habitsLeft  = habitsToday.filter(function (h) { return h.logs.indexOf(k) < 0; }).map(function (h) { return h.name; });
    var goals = state.goals.filter(function (g) { return g.year === new Date().getFullYear(); });
    var goalsPct = 0;
    if (goals.length) {
      var sum = 0;
      goals.forEach(function (g) { sum += Math.min(100, Math.round(g.progress / Math.max(1, g.target) * 100)); });
      goalsPct = Math.round(sum / goals.length);
    }
    var reminders = [];
    state.tasks.forEach(function (t) {
      if (t.remind && occursOn(t, k) && (t.doneDates || []).indexOf(k) < 0) reminders.push({ time: t.remind, text: t.text });
    });
    state.habits.forEach(function (h) {
      if (h.remind && (!h.start || h.start <= k) && (!h.end || h.end >= k) && h.logs.indexOf(k) < 0) {
        reminders.push({ time: h.remind, text: "🔥 " + h.name });
      }
    });
    return {
      tasks_done: tasksDone.length, tasks_total: tasksToday.length,
      habits_done: habitsDone.length, habits_total: habitsToday.length,
      habits_left: habitsLeft.slice(0, 5),
      goals_pct: goalsPct,
      reminders: reminders
    };
  }
  var lastSig = null;
  setInterval(function () {
    if (!tg || !tg.initData) return;
    var stats = calcStats();
    var sig = JSON.stringify([
      state.settings.morningOn, state.settings.morningTime,
      state.settings.eveningOn, state.settings.eveningTime,
      state.profile.tz, stats
    ]);
    if (sig === lastSig) return;
    lastSig = sig;
    fetch(WORKER_URL + "/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        initData: tg.initData,
        tz: state.profile.tz,
        morning_on: state.settings.morningOn,  morning_time: state.settings.morningTime,
        evening_on: state.settings.eveningOn,  evening_time: state.settings.eveningTime,
        stats: stats
      })
    }).catch(function () {});
  }, 3000);
})();
</script>
</body>
